name: CI

# Mirrors the gates the client (FancyMumbleNext) and plugin-host workspaces
# enforce, so code holds to the same standard in all three trees:
#   fmt --check | clippy -D warnings | tests | cargo-deny | Miri
#
# Starling additionally gates the protobuf contract (check-proto-drift.sh) and
# fuzzes the frame decoder, because unlike the client it decodes bytes from
# unauthenticated peers.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ----------------------------------------------------------------
  # The protobuf contract must not drift from the C++ server / client,
  # and must not break the rules no compiler enforces.
  # ----------------------------------------------------------------
  proto:
    name: Protobuf contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Consistency: our three trees agree on L0's wire meaning.
      - name: Check for protobuf drift
        run: scripts/check-proto-drift.sh

      # Hygiene: the rules the drift check is blind to *by construction*,
      # because all three trees can break them identically, a Fancy field in
      # the burned 100-999 range, and code bound to the dead proto2 envelopes.
      # Both of these shipped undetected; see docs/PROTOCOL-MIGRATION.md M6.
      # Through the interpreter rather than the shebang: the runner has it, and
      # a contributor on Windows has `python` but no `python3`, where relying on
      # the shebang fails with a Microsoft Store message instead of a result.
      - name: Check protobuf hygiene
        run: python3 scripts/check-proto-hygiene.py

      # Compatibility: our upstream surface against *actual* upstream Mumble.
      # The only one of the three that can fail with a released client on the
      # other end, the other two prove our trees agree, not that they are
      # right. Needs the upstream remote, and skips loudly without it.
      - name: Fetch upstream Mumble for the compatibility check
        run: git -C vendor/server fetch --no-tags --depth=1 upstream 1.6.x || true

      - name: Check upstream compatibility
        run: python3 scripts/check-proto-compat.py

      # Citations: the comments point at murmur by line number, and line
      # numbers rot. When vendor/server moved on 2026-08-02 it took three of
      # them with it, and each then pointed at real, plausible, unrelated
      # code, which is worse than a dangling reference because a reader who
      # follows it believes what they land on.
      - name: Check C++ citations
        run: python3 scripts/check-cpp-citations.py

  # ----------------------------------------------------------------
  # The microkernel rule: the kernel must never depend on a feature.
  # A build failure enforces what a design document could not.
  # ----------------------------------------------------------------
  layering:
    name: Crate layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Kernel depends on no feature crate
        run: scripts/check-crate-layering.sh

  # ----------------------------------------------------------------
  # Format, lint and test.
  # ----------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # starling-proto's build.rs compiles the .proto files via prost.
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      # `cargo test --all-targets` skips doctests; the lint config denies
      # broken intra-doc links, so run them too.
      - name: Doc tests
        run: cargo test --workspace --doc

      - name: Documentation builds without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  # ----------------------------------------------------------------
  # Dependency hygiene. Matters more here than in the client: this is a
  # network server that terminates TLS for untrusted peers.
  # ----------------------------------------------------------------
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: cargo-deny (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # ----------------------------------------------------------------
  # Miri (UB check).
  #
  # `unsafe_code = "deny"` in [workspace.lints.rust] means Starling's own code
  # contains no unsafe at all. Miri still earns its keep: it interprets the
  # unsafe inside dependencies (bytes, prost, hashbrown) along the paths our
  # tests actually exercise, which is where a UB regression would come from.
  #
  # Socket and async-runtime tests cannot run under Miri (no real I/O, and
  # tokio's scheduler uses unsupported syscalls), so those modules are skipped.
  # Skips are module-anchored; inclusion filters match substrings and silently
  # over-select.
  # ----------------------------------------------------------------
  miri:
    name: Miri (UB check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Miri setup
        run: cargo +nightly miri setup

      - name: Miri (starling-proto, framing and version encoding)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test -p starling-proto --lib

      - name: Miri (starling-model, pure logic, no I/O)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test -p starling-model --lib

      - name: Miri (starling-server, handlers only)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: >
          cargo +nightly miri test -p starling-server --lib --
          --skip "listener::" --skip "core::"

  # ----------------------------------------------------------------
  # Fuzz the frame decoder. It is the first thing an unauthenticated peer
  # reaches, so it gets a short run on every PR and must never panic.
  # ----------------------------------------------------------------
  fuzz:
    name: Fuzz (frame decoder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Fuzz decode
        run: cargo +nightly fuzz run decode -- -max_total_time=60
        working-directory: crates/starling-proto
