name: CI

# The same gates as the client and plugin-host workspaces:
#   fmt --check | clippy -D warnings | tests | cargo-deny | Miri
# Starling adds the protobuf contract and a fuzz of the frame decoder, since it
# decodes bytes from unauthenticated peers.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ----------------------------------------------------------------
  # The protobuf contract must not drift from the C++ server / client,
  # and must not break the rules no compiler enforces.
  # ----------------------------------------------------------------
  proto:
    name: Protobuf contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Consistency: our three trees agree on L0's wire meaning.
      - name: Check for protobuf drift
        run: scripts/check-proto-drift.sh

      # Hygiene: the rules the drift check is blind to *by construction*,
      # because all three trees can break them identically, a Fancy field in
      # the burned 100-999 range, and code bound to the dead proto2 envelopes.
      # Both of these shipped undetected; see docs/PROTOCOL-MIGRATION.md M6.
      # Through the interpreter rather than the shebang: the runner has it, and
      # a contributor on Windows has `python` but no `python3`, where relying on
      # the shebang fails with a Microsoft Store message instead of a result.
      - name: Check protobuf hygiene
        run: python3 scripts/check-proto-hygiene.py

      # Compatibility: our upstream surface against *actual* upstream Mumble,
      # downloaded from mumble-voip/mumble. The only one of the three that can
      # fail with a released client on the other end, the other two prove our
      # trees agree, not that they are right.
      #
      # This used to read the `upstream` remote in `vendor/server`, which is a
      # submodule of the *superproject*: this repo has none, so the fetch failed
      # into `|| true` and the check skipped every run since it was added. It
      # was the one step here that could catch a released-client break, and it
      # had never once looked at upstream. Downloading is what makes it real.
      #
      # Pinned to a tag rather than a branch head, so that upstream landing a
      # field cannot turn every open PR red for something outside its diff.
      # `upstream-proto.yml` watches the branch head daily instead.
      - name: Fetch upstream Mumble's protobuf definitions
        run: scripts/fetch-upstream-proto.sh

      - name: Check upstream compatibility
        run: python3 scripts/check-proto-compat.py --upstream-dir target/upstream-proto

      # Citations: the comments point at murmur by line number, and line
      # numbers rot. When vendor/server moved on 2026-08-02 it took three of
      # them with it, and each then pointed at real, plausible, unrelated
      # code, which is worse than a dangling reference because a reader who
      # follows it believes what they land on.
      - name: Check C++ citations
        run: python3 scripts/check-cpp-citations.py

  # ----------------------------------------------------------------
  # The microkernel rule: the kernel must never depend on a feature.
  # A build failure enforces what a design document could not.
  # ----------------------------------------------------------------
  layering:
    name: Crate layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Kernel depends on no feature crate
        run: scripts/check-crate-layering.sh

  # ----------------------------------------------------------------
  # Format, lint and test.
  # ----------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # starling-proto's build.rs compiles the .proto files via prost.
      # A release binary rather than apt: `apt-get update` alone was three to
      # four minutes on a bad mirror day, on a job whose compile is two.
      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      # fmt, Clippy and the doc checks are platform-portable, so they run once
      # on Linux. Windows compiles the workspace far slower, and re-running them
      # there nearly doubled its wall time for no added signal. Windows still
      # builds and runs the tests below, the coverage that is actually OS-specific.
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The lint denies the panicking macros; this asserts that the exemptions
      # left behind are argued ones. Without it the deny is one `#[allow]` away
      # from meaning nothing, and nobody would notice.
      - name: Panic audit
        if: runner.os == 'Linux'
        run: python3 scripts/check-panic-audit.py

      - name: Tests
        # Proptest's own default today, set here so a future change to it is a
        # change to this line rather than a silent loss of coverage.
        env:
          PROPTEST_CASES: 256
        run: cargo test --workspace --all-targets

      # `cargo test --all-targets` skips doctests; the lint config denies
      # broken intra-doc links, so run them too.
      - name: Doc tests
        if: runner.os == 'Linux'
        run: cargo test --workspace --doc

      - name: Documentation builds without warnings
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  # ----------------------------------------------------------------
  # The shipped plugin binaries.
  #
  # A plugin is a cdylib the server opens at runtime, so "it compiles" is not
  # the interesting question - the `test` job above already answers that for
  # every workspace member. What this job produces is the artefact a release
  # and the container image install, built in release like the ones that ship.
  #
  # This used to live in the C++ fork (`.github/workflows/plugin-host.yml`),
  # which is EOL. Starling's `mumble-plugin-api` is that tree's, unchanged and
  # at the same ABI, so the binaries are interchangeable; the build moved here
  # because the fork it was in is not maintained any more.
  # ----------------------------------------------------------------
  plugins:
    name: Plugin cdylibs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: plugins

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      # Named one by one rather than `--workspace`: this is the list of things
      # that ship as loadable plugins, and it should be a list somebody has to
      # edit deliberately when it changes.
      - name: Build plugin cdylibs (release)
        run: cargo build --release -p mumble-friends -p mumble-live-doc

      # The loader rejects a plugin whose ABI probe disagrees with the host's,
      # and it is far cheaper to learn that here than from a server that came
      # up with no plugins. `friends` is the host's own exit test.
      - name: Loader accepts what was built
        if: runner.os == 'Linux'
        run: cargo test -p starling-plugin-host --test loads_a_real_plugin

      - name: Upload plugin cdylibs
        uses: actions/upload-artifact@v7
        with:
          name: starling-plugins-${{ matrix.os }}
          path: |
            target/release/libmumble_friends.so
            target/release/libmumble_live_doc.so
            target/release/mumble_friends.dll
            target/release/mumble_live_doc.dll
          if-no-files-found: error

  # ----------------------------------------------------------------
  # Dependency hygiene. Matters more here than in the client: this is a
  # network server that terminates TLS for untrusted peers.
  # ----------------------------------------------------------------
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: cargo-deny (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # ----------------------------------------------------------------
  # Miri (UB check).
  #
  # `unsafe_code = "deny"` in [workspace.lints.rust] means Starling's own code
  # contains no unsafe at all. Miri still earns its keep: it interprets the
  # unsafe inside dependencies (bytes, prost, hashbrown) along the paths our
  # tests actually exercise, which is where a UB regression would come from.
  #
  # It runs over the two contract crates, whose lib tests are pure logic (frame
  # and version encoding, the permission bitset, envelope type allocation) with
  # no I/O. Socket and async-runtime tests cannot run under Miri (no real I/O,
  # and tokio's scheduler uses unsupported syscalls), so the service crates,
  # whose lib tests stand up the runtime, are left to the normal test job.
  # ----------------------------------------------------------------
  miri:
    name: Miri (UB check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Miri setup
        run: cargo +nightly miri setup

      # Miri interprets every proptest case, which made the three codec
      # properties nine of the job's fifteen minutes at the default 256. The
      # search for a counterexample is the normal test job's; this one is
      # after UB on the paths a case exercises, and sixteen cases walk them.
      - name: Miri (starling-proto, framing and version encoding)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: 16
        run: cargo +nightly miri test -p starling-proto --lib

      - name: Miri (starling-proto-fancy, envelope, permission and page logic)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test -p starling-proto-fancy --lib

  # ----------------------------------------------------------------
  # Fuzz the surfaces an unauthenticated peer reaches.
  #
  # Replay first, search second. The committed corpus in `fuzz/corpus/` is what
  # makes this a regression test: an input that crashed once fails again in
  # seconds, rather than waiting for the fuzzer to rediscover it inside a
  # timebox. The search that follows is a bounded top-up on the four surfaces
  # reachable before authentication, not an attempt to find something new in a
  # minute.
  # ----------------------------------------------------------------
  fuzz:
    name: Fuzz (replay, then search)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: fuzz

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # Pin the gnu host target here and below. cargo-fuzz otherwise selects
      # x86_64-unknown-linux-musl, whose static libc is incompatible with
      # AddressSanitizer and whose std the runner does not have.
      - name: Build every target
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
        working-directory: fuzz

      - name: Replay the committed corpus
        # `-runs=0` executes the corpus and stops. Every target, about a minute
        # for all ten, and the only step that can fail on a PR that added no
        # fuzzing of its own.
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::replay $target"
            cargo +nightly fuzz run "$target" \
              --target x86_64-unknown-linux-gnu -- -runs=0
            echo "::endgroup::"
          done
        working-directory: fuzz

      - name: Search the pre-authentication surfaces
        # Twenty seconds each. Long enough to explore what the diff changed,
        # short enough that the job stays under the ten-minute PR budget; the
        # real search is the nightly's six minutes a target.
        run: |
          search() {
            echo "::group::search $1"
            cargo +nightly fuzz run "$1" --target x86_64-unknown-linux-gnu \
              -- "${@:2}" -max_total_time=20
            echo "::endgroup::"
          }
          search decode -dict=dictionaries/mumble.dict
          search voice_packet -dict=dictionaries/voice.dict
          search voice_varint -dict=dictionaries/voice.dict
          search peer_cert
        working-directory: fuzz

      - name: Keep the crashing input
        # Without this the run reports a crash and throws away the bytes that
        # caused it, which costs a whole rediscovery to reproduce.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
