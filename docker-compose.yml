# Starling for docker compose: the Kubernetes shape with load balancers replaced
# by published ports, and voice reachable at the same host:port as the gateway
# (a legacy Mumble client sends UDP to the port it made TCP to).
#
# One image, twenty containers, one TOML, nineteen services and the gateway.
# The entrypoint takes a service name, so every container below differs only in
# its `command`.
#
#   docker compose up -d --wait --build  # build, start in tier order, block
#   docker compose logs -f gateway       # follow one service
#   docker compose down                  # stop, keep the certificate + data
#   docker compose down -v               # ... and throw the volume away
#
# The image defaults to a locally built `starling:local`, which is why `--build`
# is here. To run a published build instead, set STARLING_IMAGE and drop
# `--build` (tags and the release flow are in docs/RELEASING.md):
#   STARLING_IMAGE=ghcr.io/fancy-mumble/starling:latest docker compose up -d --wait
#
# `--build` matters: compose builds only when the image is missing, so a stale
# `starling:local` is reused and a service added since the last build exits with
# `no service named "..."`. Rebuild whenever `crates/` has moved.
#
# Connect a Mumble client to localhost:64738. On first boot the gateway
# generates a self-signed certificate into the `starling-data` volume, so the
# client will ask you to trust it once and not again.
#
# Two things are off by default:
#
#   docker compose --profile admin up -d --wait   # ... plus operator-api
#   docker compose up -d --wait starling          # instead: ONE container
#
# A profile is additive (admin adds operator-api). All-in-one is a *replacement*:
# naming the `starling` service starts it alone and enables its profile, whereas
# `--profile all-in-one` would start it alongside the twenty it replaces, both
# claiming port 64738.
#
# `--wait` returns when every container is healthy. Health is a TCP connect (no
# HTTP /healthz here), so healthy means "the listener is up", not "caches warm".

# ---------------------------------------------------------------------------
# What every service shares. Only `command` differs between most of them.
# ---------------------------------------------------------------------------
# A probe that stops once it has succeeded.
#
# `/dev/tcp` is a bash builtin (dash lacks it, no curl in the image), so the only
# external probe is a TCP connect. Against the gateway that is an incomplete TLS
# handshake, which it logs as a security event -- so the first success latches to
# a file and every later probe is a stat, rather than filling that log every two
# seconds. The file is on a per-container tmpfs, recreated empty on every start,
# so a restarted container genuinely re-probes.
#
# Trade-off: health stops tracking liveness after the first success, which is
# fine here -- `depends_on` and `up --wait` are start-up gates, and a dead
# process takes its container with it.
#
# $$HOSTNAME, not 127.0.0.1: the runtime has one address per service rather than
# a bind/advertise pair, so a service reached at `http://text:50051` *binds* that
# name, which resolves to the container's network address and not to loopback.
# The doubled $$ escapes compose's own interpolation so bash expands it.
x-grpc-healthcheck: &grpc-healthcheck
  test:
    - "CMD"
    - "bash"
    - "-c"
    - "test -e /run/health/up || { exec 3<>/dev/tcp/$$HOSTNAME/50051 && : > /run/health/up; }"
  interval: 2s
  timeout: 3s
  retries: 15
  start_period: 10s

x-starling: &starling
  image: ${STARLING_IMAGE:-starling:local}
  # Same image for every service: built once, cache hits after.
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  # SIGTERM drains the runtime; 30s to finish (Docker's default 10s cuts it
  # short, 30s is what Kubernetes allows).
  stop_grace_period: 30s
  networks: [starling]
  volumes:
    # One volume: each service writes its own SQLite file named after itself,
    # and no service reads another's tables. The gateway's generated
    # certificate lives here too, which is why it must survive `down`.
    - starling-data:/var/lib/starling
    # The same routing table for all of them. A per-container file would let
    # two services disagree about where a third one is.
    - ./deploy/starling.toml:/etc/starling/starling.toml:ro
  # Where the healthcheck latches its first success. In memory and per container,
  # so it is empty again after a restart, a named volume here would make one
  # early success permanent for the life of the deployment.
  tmpfs:
    - /run/health
  environment:
    RUST_LOG: ${STARLING_LOG:-info}
  healthcheck: *grpc-healthcheck

services:
  # -------------------------------------------------------------------------
  # essential, the four authorities. Nothing else has to be up for these, so
  # they start first and everything else waits on them.
  #
  # Down means: reject logins.
  # -------------------------------------------------------------------------
  permissions:
    <<: *starling
    command: ["permissions", "--config", "/etc/starling/starling.toml"]

  userdata:
    <<: *starling
    command: ["userdata", "--config", "/etc/starling/starling.toml"]

  metadata:
    <<: *starling
    command: ["metadata", "--config", "/etc/starling/starling.toml"]

  server-config:
    <<: *starling
    command: ["server-config", "--config", "/etc/starling/starling.toml"]

  # The composed read model the other services read through. No client-facing
  # type, so the gateway never attaches; it waits only because it calls
  # permissions and userdata.
  session-view:
    <<: *starling
    command: ["session-view", "--config", "/etc/starling/starling.toml"]
    depends_on:
      permissions: {condition: service_healthy}
      userdata: {condition: service_healthy}

  # Owns a connection's existence: version, auth, CryptSetup, Ping, timeout,
  # teardown. Waits on voice because voice mints the ciphers (key material never
  # crosses a service boundary), handing back a ready-made CryptSetup to forward.
  session-lifecycle:
    <<: *starling
    command: ["session-lifecycle", "--config", "/etc/starling/starling.toml"]
    depends_on:
      session-view: {condition: service_healthy}
      userdata: {condition: service_healthy}
      metadata: {condition: service_healthy}
      server-config: {condition: service_healthy}
      voice: {condition: service_healthy}

  # -------------------------------------------------------------------------
  # core, down means that feature is dead and the server still runs.
  # -------------------------------------------------------------------------

  # Its own UDP socket: audio goes client -> voice with no gateway hop, so this
  # publishes UDP 64738 where the gateway publishes TCP 64738 -- one host:port
  # pair to a legacy client.
  voice:
    <<: *starling
    command: ["voice", "--config", "/etc/starling/starling.toml"]
    ports:
      - "${STARLING_PORT:-64738}:64738/udp"

  text:
    <<: *starling
    command: ["text", "--config", "/etc/starling/starling.toml"]

  pchat:
    <<: *starling
    command: ["pchat", "--config", "/etc/starling/starling.toml"]

  moderation:
    <<: *starling
    command: ["moderation", "--config", "/etc/starling/starling.toml"]

  # -------------------------------------------------------------------------
  # optional: down means nobody notices. Nothing waits on these; the gateway
  # sheds their routes by tier rather than refusing logins.
  # -------------------------------------------------------------------------
  screenshare:
    <<: *starling
    command: ["screenshare", "--config", "/etc/starling/starling.toml"]

  # The bulk plane: the gateway hands out a short-lived signed URL over the
  # control channel and the bytes move over HTTP, so a large upload cannot
  # head-of-line block every control message behind it.
  files:
    <<: *starling
    command: ["files", "--config", "/etc/starling/starling.toml"]
    ports:
      - "${STARLING_FILES_PORT:-8080}:8080/tcp"
    healthcheck:
      # Both listeners: the gRPC surface and its own HTTP one -- checking only
      # the first would call it ready with bulk transfer dead.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "test -e /run/health/up || { exec 3<>/dev/tcp/$$HOSTNAME/50051 && exec 4<>/dev/tcp/127.0.0.1/8080 && : > /run/health/up; }"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  plugins:
    <<: *starling
    command: ["plugins", "--config", "/etc/starling/starling.toml"]

  push:
    <<: *starling
    command: ["push", "--config", "/etc/starling/starling.toml"]

  audit:
    <<: *starling
    command: ["audit", "--config", "/etc/starling/starling.toml"]

  onboarding:
    <<: *starling
    command: ["onboarding", "--config", "/etc/starling/starling.toml"]

  social:
    <<: *starling
    command: ["social", "--config", "/etc/starling/starling.toml"]

  link-preview:
    <<: *starling
    command: ["link-preview", "--config", "/etc/starling/starling.toml"]

  context-actions:
    <<: *starling
    command: ["context-actions", "--config", "/etc/starling/starling.toml"]

  # Announces this server to the public Mumble list hourly. Silent until
  # registry_name / registry_password / registry_url are set in server-config,
  # and it never announces a password-protected server. Reads the gateway's
  # certificate from the shared volume so the fingerprint it publishes matches.
  directory:
    <<: *starling
    command: ["directory", "--config", "/etc/starling/starling.toml"]
    healthcheck:
      # Nothing to probe: no gRPC surface, no listener, nothing dials it. A TCP
      # check would fail forever and hold `up --wait` open; no healthcheck means
      # ready once running, which is the truth available for a timer loop.
      disable: true

  # Dialled, unlike directory: it polls every service on a timer and holds the
  # answers, so `operator-api` serves `/v1/health` from one snapshot. In the
  # default set (not `--profile admin`) so the sweep has history before the
  # dashboard opens -- a service that stops answering reads UNREACHABLE, which
  # none can report about itself.
  health:
    <<: *starling
    command: ["health", "--config", "/etc/starling/starling.toml"]

  # -------------------------------------------------------------------------
  # The front door, started last. It reconnects to services on its own, so the
  # depends_on below is only so `up --wait` returning means a client can log in,
  # not just that the port is open. It waits on essential and core only --
  # waiting on optional would make a broken link-preview an outage.
  # -------------------------------------------------------------------------
  gateway:
    <<: *starling
    command: ["gateway", "--config", "/etc/starling/starling.toml"]
    ports:
      - "${STARLING_PORT:-64738}:64738/tcp"
    healthcheck:
      # An unfinished TLS handshake, which the gateway records; latched so it
      # happens once per start, not every two seconds.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "test -e /run/health/up || { exec 3<>/dev/tcp/127.0.0.1/64738 && : > /run/health/up; }"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s
    depends_on:
      session-lifecycle: {condition: service_healthy}
      session-view: {condition: service_healthy}
      permissions: {condition: service_healthy}
      metadata: {condition: service_healthy}
      userdata: {condition: service_healthy}
      server-config: {condition: service_healthy}
      voice: {condition: service_healthy}
      text: {condition: service_healthy}
      pchat: {condition: service_healthy}
      moderation: {condition: service_healthy}

  # -------------------------------------------------------------------------
  # The admin plane, `--profile admin`.
  #
  # The highest-privilege surface: off unless asked for, loopback-only, and
  # refusing any request it cannot first record. It calls the authorities
  # directly, not through session-view, since an operator edits registered
  # accounts and offline bans while session-view sees only connected users.
  #
  #   STARLING_ADMIN_TOKEN=$(openssl rand -hex 32) \
  #     docker compose --profile admin up -d --wait
  #   curl -H "Authorization: Bearer $STARLING_ADMIN_TOKEN" \
  #     http://127.0.0.1:8081/healthz
  # -------------------------------------------------------------------------
  operator-api:
    <<: *starling
    profiles: ["admin"]
    command: ["operator-api", "--config", "/etc/starling/starling.toml"]
    environment:
      RUST_LOG: ${STARLING_LOG:-info}
      # The TOML ships `enabled = false` so that nothing starts this surface by
      # accident; choosing the profile is the act that turns it on.
      STARLING_SERVICES_OPERATOR_API_ENABLED: "true"
      # Empty rather than a default, never a literal. An unset variable arrives
      # empty, and an empty bearer token is refused as malformed, so forgetting
      # to set it starts an admin plane nobody can authenticate to -- fail-closed.
      STARLING_ADMIN_TOKEN: ${STARLING_ADMIN_TOKEN:-}
    ports:
      # 127.0.0.1 on purpose. This wants the opposite exposure to the gateway.
      - "127.0.0.1:${STARLING_ADMIN_PORT:-8081}:8081/tcp"
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "test -e /run/health/up || { exec 3<>/dev/tcp/127.0.0.1/8081 && : > /run/health/up; }"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s
    depends_on:
      userdata: {condition: service_healthy}
      moderation: {condition: service_healthy}
      server-config: {condition: service_healthy}
      # `/v1/health` is the route a dashboard opens on; waiting on health here
      # makes `--profile admin up --wait` mean the Health page works, not just
      # that :8081 accepts connections.
      health: {condition: service_healthy}

  # -------------------------------------------------------------------------
  # The single-box deployment: every service in one process, gRPC replaced by
  # in-process calls. `--all-in-one` overrides the file's `all_in_one = false`,
  # so there is no second config.
  #
  #   docker compose up -d --wait starling
  #
  # Name the service, don't use `--profile all-in-one`: a profile only adds, so
  # it would also start the twenty containers this replaces and fight over port
  # 64738.
  #
  # The `inproc:` endpoint overrides below are required. A service binds its own
  # `endpoint` in every mode, so left alone all twenty-one would try to bind
  # `http://<name>:50051` -- names of the containers this replaces, which are not
  # running -- and die. Overriding here, not in the TOML, keeps one routing table
  # for both deployments.
  # -------------------------------------------------------------------------
  starling:
    <<: *starling
    profiles: ["all-in-one"]
    command: ["--all-in-one", "--config", "/etc/starling/starling.toml"]
    environment:
      RUST_LOG: ${STARLING_LOG:-info}
      STARLING_SERVICES_SESSION_LIFECYCLE_ENDPOINT: inproc:session-lifecycle
      STARLING_SERVICES_SESSION_VIEW_ENDPOINT: inproc:session-view
      STARLING_SERVICES_PERMISSIONS_ENDPOINT: inproc:permissions
      STARLING_SERVICES_METADATA_ENDPOINT: inproc:metadata
      STARLING_SERVICES_USERDATA_ENDPOINT: inproc:userdata
      STARLING_SERVICES_SERVER_CONFIG_ENDPOINT: inproc:server-config
      STARLING_SERVICES_VOICE_ENDPOINT: inproc:voice
      STARLING_SERVICES_TEXT_ENDPOINT: inproc:text
      STARLING_SERVICES_PCHAT_ENDPOINT: inproc:pchat
      STARLING_SERVICES_MODERATION_ENDPOINT: inproc:moderation
      STARLING_SERVICES_SCREENSHARE_ENDPOINT: inproc:screenshare
      STARLING_SERVICES_FILES_ENDPOINT: inproc:files
      STARLING_SERVICES_PLUGINS_ENDPOINT: inproc:plugins
      STARLING_SERVICES_PUSH_ENDPOINT: inproc:push
      STARLING_SERVICES_AUDIT_ENDPOINT: inproc:audit
      STARLING_SERVICES_ONBOARDING_ENDPOINT: inproc:onboarding
      STARLING_SERVICES_SOCIAL_ENDPOINT: inproc:social
      STARLING_SERVICES_LINK_PREVIEW_ENDPOINT: inproc:link-preview
      STARLING_SERVICES_CONTEXT_ACTIONS_ENDPOINT: inproc:context-actions
      STARLING_SERVICES_HEALTH_ENDPOINT: inproc:health
      STARLING_SERVICES_GATEWAY_ENDPOINT: inproc:gateway
      # Not started by this profile (the TOML ships it disabled), but named so
      # that turning it on here does not reintroduce the failure above.
      STARLING_SERVICES_OPERATOR_API_ENDPOINT: inproc:operator-api
    ports:
      - "${STARLING_PORT:-64738}:64738/tcp"
      - "${STARLING_PORT:-64738}:64738/udp"
      - "${STARLING_FILES_PORT:-8080}:8080/tcp"
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "test -e /run/health/up || { exec 3<>/dev/tcp/127.0.0.1/64738 && : > /run/health/up; }"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

networks:
  starling:
    driver: bridge

volumes:
  # Survives `down`, dies on `down -v`. Losing it regenerates the gateway's
  # certificate, and every client that has connected before sees a fingerprint
  # change, which is what a man-in-the-middle also looks like.
  starling-data:
