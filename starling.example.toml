# Starling deployment configuration.
#
#   starling --all-in-one --config starling.toml
#   starling text          --config starling.toml
#
# This file is the *deployment* layer: endpoints, ports, TLS paths, storage
# URLs, tiers and routes. Everything an operator changes while the server runs —
# bandwidth, message limits, the welcome text — belongs to the `server-config`
# service instead, because the two have different lifetimes (docs/CONFIGURATION.md).
#
# Unknown keys are rejected at startup rather than ignored, so a typo fails
# loudly instead of silently leaving a limit at its default. Every key is
# overridable by environment variable: [services.text] endpoint becomes
# STARLING_SERVICES_TEXT_ENDPOINT.
#
# Migrating from murmur? `starling migrate-config mumble-server.ini` prints the
# equivalent of an existing .ini on stdout.

[runtime]
# Every service in one process, over in-memory transports. Same binary, same
# file; `endpoint` values are ignored. This is the mode for a single VPS.
all_in_one = false
# Generated certificates and default databases live here.
data_dir = "starling-data"

[[virtual_servers]]
id = 1
name = "Starling"
port = 64738

# -- The gateway ------------------------------------------------------------

[gateway]
listen_tcp = "0.0.0.0:64738"
# Per client. Full means disconnect that client: dropping a control message
# desyncs it permanently and silently, and unbounded queueing is a memory DoS.
control_queue = 4096
# Per client, for tunnelled audio. Full means drop the oldest and count it.
audio_queue = 128
default_deadline = "5s"
# Deadlines alone fail slowly, so a service that keeps failing is shed at the
# door instead of being waited on.
breaker_failures = 5
breaker_cooldown = "10s"

[gateway.tls]
# Omit both and a self-signed pair is generated on first boot, as murmur does.
# cert = "/etc/starling/tls/cert.pem"
# key  = "/etc/starling/tls/key.pem"

# Buckets are per route, never one shared. murmur's single 1 msg/s bucket
# silently ate screen-share SDP offers; here a throttled message is reported.
[gateway.limits.control]
rate = "1/s"
burst = 5
[gateway.limits.signalling]
rate = "10/s"
burst = 20
[gateway.limits.plugin]
rate = "4/s"
burst = 15

# A Fancy client that reconnects replays only the gap rather than pulling a
# full flood of every ChannelState and UserState. Legacy clients cannot resume.
[gateway.resume]
enabled = true
ring = 256
ttl = "120s"

# -- Observability ----------------------------------------------------------

[telemetry]
log_format = "text"          # json | text
# metrics = "0.0.0.0:9090"
# otlp_endpoint = "http://otel-collector:4317"

# -- Services ---------------------------------------------------------------
#
# Every block takes the same keys. `types` is the outer message type from
# docs/PROTOCOL-COMPATIBILITY.md §3 — one number per service, because a
# service's own message types live in its nested envelope and the gateway never
# looks inside. Adding a service is three lines and no gateway release.

[services.session-lifecycle]
endpoint = "unix:/run/starling/session-lifecycle.sock"
tier = "essential"
types = [0, 2, 3, 4, 5, 15, 21, 1000]

[services.session-view]
endpoint = "unix:/run/starling/session-view.sock"
tier = "essential"
types = []                   # no client-facing type: internal by construction

[services.permissions]
endpoint = "unix:/run/starling/permissions.sock"
tier = "essential"
types = [12, 13, 20, 1001]

[services.metadata]
endpoint = "unix:/run/starling/metadata.sock"
tier = "essential"
types = [6, 7, 1002]

[services.userdata]
endpoint = "unix:/run/starling/userdata.sock"
tier = "essential"
types = [9, 14, 18, 22, 23, 1003]

[services.server-config]
endpoint = "unix:/run/starling/server-config.sock"
tier = "essential"
types = [24, 25, 1013]

[services.voice]
endpoint = "unix:/run/starling/voice.sock"
tier = "core"
types = [1, 19, 1004]        # UDPTunnel, VoiceTarget, Fancy envelope
udp_listen = "0.0.0.0:64738" # voice's OWN socket — audio skips the gateway

[services.text]
endpoint = "unix:/run/starling/text.sock"
tier = "core"
types = [11, 1005]

[services.pchat]
endpoint = "unix:/run/starling/pchat.sock"
tier = "core"
types = [1006]

[services.moderation]
endpoint = "unix:/run/starling/moderation.sock"
tier = "core"
types = [8, 10, 1007]

[services.screenshare]
endpoint = "unix:/run/starling/screenshare.sock"
tier = "optional"
types = [1008]
limits = "signalling"        # not the 1/s control bucket

[services.files]
endpoint = "unix:/run/starling/files.sock"
tier = "optional"
types = [1009]
listen = "0.0.0.0:8080"
public_url = "https://files.example.org"
url_ttl = "15m"
max_upload = "512MiB"

[services.plugins]
endpoint = "unix:/run/starling/plugins.sock"
tier = "optional"
types = [26, 1010]
limits = "plugin"

[services.push]
endpoint = "unix:/run/starling/push.sock"
tier = "optional"
types = [1011]

[services.audit]
endpoint = "unix:/run/starling/audit.sock"
tier = "optional"
types = [1012]

[services.onboarding]
endpoint = "unix:/run/starling/onboarding.sock"
tier = "optional"
types = [1014]

[services.social]
endpoint = "unix:/run/starling/social.sock"
tier = "optional"
types = [1015]

[services.link-preview]
endpoint = "unix:/run/starling/link-preview.sock"
tier = "optional"
types = [1016]

[services.context-actions]
endpoint = "unix:/run/starling/context-actions.sock"
tier = "optional"
types = [16, 17, 1017]

# -- Storage, per service ---------------------------------------------------
#
# Each service owns its own schema; no service reads another's tables. With no
# block, a SQLite file under `data_dir` named after the service is used.
#
# [services.pchat.storage]
# url = "postgres://starling:@db/starling_pchat"
# max_connections = 16

# -- The admin plane --------------------------------------------------------
#
# The replacement for Ice: REST + OpenAPI, authentication is whatever you
# already run, and every action is recorded before it happens. Off by default
# and localhost-bound when on, because it wants the opposite exposure to the
# gateway's.

[services.operator-api]
enabled = false
listen = "127.0.0.1:8081"
tier = "optional"
types = []

[services.operator-api.auth]
mode = "token"               # oidc | jwt | mtls | token

[services.operator-api.auth.token]
# The variable's name, never the secret itself.
tokens = [{ value_env = "STARLING_ADMIN_TOKEN", scopes = ["*"] }]

# [services.operator-api.auth.oidc]
# issuer      = "https://keycloak.example.org/realms/starling"
# audience    = "starling-admin"
# scope_claim = "roles"
# [services.operator-api.auth.oidc.map]
# "starling-admin"   = ["*"]
# "starling-auditor" = ["userdata:read", "audit:read"]

[services.operator-api.audit]
path = "/var/log/starling/operator-audit.log"
# Cannot be recorded -> it does not happen.
fail_closed = true
