# Starling.
#
#   starling --all-in-one --config starling.toml
#
# Copy this file, change what you care about, delete the rest. Anything you do
# not mention keeps its built-in value, so a three-line file is a working
# server. Unknown keys are refused at startup, so a typo fails loudly.
#
# Everything under [instances.settings] can also be changed later from the
# admin UI, and a setting you change there stops following this file -- your
# choice wins, and the rest of the file goes on working.
#
# The advanced knobs are not here. Rate limits, service endpoints, the admin API
# and log routing live in `examples/advanced/`, one file each; pull one in with
#
#   include = ["examples/advanced/logging.toml"]
#
# `examples/reference.toml` lists every key that exists, with its default and a
# sentence on what it does.
#
# Migrating from murmur? `starling migrate-config mumble-server.ini` prints the
# equivalent of an existing .ini on stdout.


# -- Your server ------------------------------------------------------------

[[instances]]
# Shown in the server browser, and the name of the root channel.
name = "Starling"
# The port clients connect to, TCP and UDP. Mumble's default is 64738.
port = 64738


[instances.settings]

# How many people may be connected at once.
max_users = 100
# Required to connect. Empty means anyone with the address can join.
# A server with a password set is never listed publicly.
password = ""
# Shown once, on connect. Supports the basic HTML a Mumble client renders.
welcome_text = ""
# Refuse anyone whose client has no certificate. Certificates are how Mumble
# recognises a returning user, so this is stricter than it sounds: it keeps out
# people who never made one, not people you have not met.
cert_required = false

# Audio ---------------------------------------------------------------------

# Bits per second per speaking user. 72000 is Mumble's default and sounds good;
# lower it if your uplink is the bottleneck.
max_bandwidth = 72000
# Whether clients may record, and announce that they are recording.
allow_recording = true

# Chat ----------------------------------------------------------------------

# Longest message, in characters. 0 removes the limit.
text_message_length = 5000
# Longest image, in bytes. Images are sent inline in messages.
image_message_length = 131072
# Whether messages may carry markup. Off means plain text everywhere.
allow_html = true
# Days of chat history kept before it is deleted.
log_days = 31

# Channels ------------------------------------------------------------------

# How deep the channel tree may go, and how many channels may exist at all.
channel_nesting_limit = 10
channel_count_limit = 1000

# Being listed publicly -----------------------------------------------------
#
# Off until these are filled in. Announcing a server to the public list is a
# decision you cannot take back, so silence is the default. Note that a server
# with a password is never listed, and neither is one that does not answer
# server-browser pings (`allow_ping`, on by default).

# registry_name     = "Frog Pond"
# registry_url      = "https://frogpond.example"   # required; the listing links here
# registry_password = "a secret you choose"        # proves a later update is still you
# registry_hostname = "frogpond.example"           # how the list should reach you
# registry_location = "DE"                         # ISO country code


# -- Files ------------------------------------------------------------------
#
# Uploads and avatars. Delete this block for the defaults, or say
# `enabled = false` to switch file sharing off entirely.

[services.files]
# Largest upload accepted.
max_upload = "512MiB"
# How long a download link stays valid.
url_ttl = "15m"
# What download links point at. Set this once the server is reachable under a
# name other than the one you are testing from.
# public_url = "https://files.example.org"


# -- Screen share -----------------------------------------------------------
#
# Signalling always works. Media relay (the WebRTC SFU) starts only when
# `public_url` names the literal IP clients can reach this host at - an IP,
# not a hostname, because it goes into SDP answers verbatim. Without it,
# clients are told the server has no relay.

# [services.screenshare]
# public_url = "203.0.113.9:64740"
# UDP port for media. 0 or absent = OS-assigned.
# options = { media_port = "64740" }


# -- TLS --------------------------------------------------------------------
#
# With neither key set, a self-signed certificate is generated on first boot and
# kept in `data_dir`. That is fine, and not a compromise: Mumble clients
# identify a server by certificate fingerprint rather than by a public
# authority. Set both to present your own instead.

# [gateway.tls]
# cert = "/etc/starling/tls/cert.pem"
# key  = "/etc/starling/tls/key.pem"


# -- Where things are kept --------------------------------------------------

[runtime]
# Databases, the generated certificate, and the sockets services talk over.
# Back this directory up and you have backed up the server.
data_dir = "starling-data"


# -- Logs -------------------------------------------------------------------
#
# Who connected, what was refused, what an admin changed. This is the record you
# keep; developer diagnostics are a separate dial (`RUST_LOG`).

[logging]
level = "info"               # debug | info | notice | warning | error

# [logging.file]
# path = "/var/log/starling/server.log"
