[workspace]
# v3 is the edition-2024 default for packages, but a virtual manifest has to
# opt in by hand or it silently stays on v2. v3 is what makes `rust-version`
# below bind: a dependency needing a newer compiler is not selected.
resolver = "3"
members = [
    # Wire and security primitives — no I/O, no state.
    "crates/proto",
    "crates/proto-fancy",
    "crates/gate",
    "crates/crypto",

    # The one common standalone crate every service is built on.
    "crates/runtime",

    # The only component that holds a client's socket.
    "crates/gateway",

    # Services, in the tiers of docs/ARCHITECTURE.md §4.
    "crates/services/session-lifecycle",
    "crates/services/session-view",
    "crates/services/permissions",
    "crates/services/metadata",
    "crates/services/userdata",
    "crates/services/server-config",
    "crates/services/voice",
    "crates/services/text",
    "crates/services/pchat",
    "crates/services/moderation",
    "crates/services/screenshare",
    "crates/services/files",
    "crates/services/plugins",
    "crates/services/push",
    "crates/services/audit",
    "crates/services/onboarding",
    "crates/services/social",
    "crates/services/link-preview",
    "crates/services/context-actions",

    # Outward-facing: what this server tells the world about itself.
    "crates/services/directory",

    # The admin plane, and the entrypoint every deployment runs.
    "crates/operator-api",
    "crates/migrate",
    "crates/starling",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
# Matches rust-toolchain.toml. Kept in step with it deliberately: this is the
# version the resolver holds dependencies to, so letting it drift below the
# pin would admit crates the pinned compiler cannot build.
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
# -- internal ---------------------------------------------------------------
starling-proto = { path = "crates/proto" }
starling-proto-fancy = { path = "crates/proto-fancy" }
starling-gate = { path = "crates/gate" }
starling-crypto = { path = "crates/crypto" }
starling-runtime = { path = "crates/runtime" }
starling-gateway = { path = "crates/gateway" }
starling-session-lifecycle = { path = "crates/services/session-lifecycle" }
starling-session-view = { path = "crates/services/session-view" }
starling-permissions = { path = "crates/services/permissions" }
starling-metadata = { path = "crates/services/metadata" }
starling-userdata = { path = "crates/services/userdata" }
starling-server-config = { path = "crates/services/server-config" }
starling-voice = { path = "crates/services/voice" }
starling-text = { path = "crates/services/text" }
starling-pchat = { path = "crates/services/pchat" }
starling-moderation = { path = "crates/services/moderation" }
starling-screenshare = { path = "crates/services/screenshare" }
starling-files = { path = "crates/services/files" }
starling-plugins = { path = "crates/services/plugins" }
starling-push = { path = "crates/services/push" }
starling-audit = { path = "crates/services/audit" }
starling-onboarding = { path = "crates/services/onboarding" }
starling-social = { path = "crates/services/social" }
starling-link-preview = { path = "crates/services/link-preview" }
starling-context-actions = { path = "crates/services/context-actions" }
starling-directory = { path = "crates/services/directory" }
starling-operator-api = { path = "crates/operator-api" }
starling-migrate = { path = "crates/migrate" }

# -- wire -------------------------------------------------------------------
bytes = "1"
prost = "0.14.3"
prost-build = "0.14.3"
tonic = { version = "0.14", features = ["router", "transport"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"

# -- runtime ----------------------------------------------------------------
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "macros",
    "time",
    "io-util",
    "signal",
    "fs",
] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
# QUIC and HTTP/3, for the WebTransport half of the live channel.
# quinn default features drag in rustls-platform-verifier and, through it, jni:
# this dials nothing and verifies no peer, so a trust store is dead weight.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
# : WebTransport requires the client and server to agree on datagram
# support, and h3-quinn does not implement the extension without it.
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-webtransport = "0.1.2"
rcgen = "0.14.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

# -- data -------------------------------------------------------------------
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "any",
    "sqlite",
    "mysql",
    "postgres",
] }
uuid = { version = "1", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.3+spec-1.1.0"
zstd = "0.13"

# -- crypto -----------------------------------------------------------------
aes = "0.9.2"
chacha20 = "0.10.1"
chacha20poly1305 = "0.11"
hkdf = "0.13"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
rand = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
jsonwebtoken = "11"
base64 = "0.23"

# -- diagnostics ------------------------------------------------------------
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
arc-swap = "1"
bitflags = "2.13"
async-trait = "0.1"
socket2 = "0.6"

# -- Workspace-wide lints ---------------------------------------------------
# Mirrors the FancyMumble client and mumble-plugin-host workspaces so crates
# compile cleanly with the same standards across all three trees.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_crate_dependencies = "warn"
unused_results = "deny"
missing_debug_implementations = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
uninlined_format_args = "warn"
doc_markdown = "warn"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
excessive_nesting = "deny"
too_many_lines = "deny"
allow_attributes_without_reason = "deny"
branches_sharing_code = "deny"
collapsible_else_if = "deny"
expect_used = "warn"

# -- Bugs that are silent when they happen ----------------------------------
# Each of these was measured to fire zero times when it was added, so they cost
# nothing today and exist to keep it that way.
debug_assert_with_mut_call = "deny"  # the side effect disappears in release
read_zero_byte_vec = "deny"          # `read` into an empty Vec reads nothing
path_buf_push_overwrite = "deny"     # pushing an absolute path drops the base
fallible_impl_from = "deny"          # `From` must not panic; `TryFrom` exists
panic_in_result_fn = "deny"          # completes unwrap_used/expect_used above
mem_forget = "deny"
rc_mutex = "deny"
rc_buffer = "warn"
mutex_atomic = "warn"

# -- Hygiene: never wanted in a shipped server ------------------------------
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
exit = "deny"
print_stdout = "deny"
print_stderr = "deny"

# -- Consistency this tree already keeps ------------------------------------
# `string_to_string` is not here: it was removed in 1.95, folded into
# `implicit_clone` above.
str_to_string = "warn"
semicolon_if_nothing_returned = "warn"
redundant_type_annotations = "warn"
unnecessary_self_imports = "warn"
try_err = "warn"
unneeded_field_pattern = "warn"
rest_pat_in_fully_bound_structs = "warn"
empty_drop = "warn"
trailing_empty_array = "warn"
pathbuf_init_then_push = "warn"
if_then_some_else_none = "warn"
missing_assert_message = "warn"
verbose_file_reads = "warn"
filetype_is_file = "warn"
create_dir = "warn"
lossy_float_literal = "warn"
while_float = "warn"
suspicious_xor_used_as_pow = "warn"

# -- Correctness, cleared before being turned on ----------------------------
float_cmp = "warn"
unwrap_in_result = "warn"
checked_conversions = "warn"
unnested_or_patterns = "warn"
needless_continue = "warn"
string_slice = "warn"
iter_over_hash_type = "warn"
redundant_clone = "warn"
unused_async = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"
