{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "starling.serviceAccountName" . }}
  labels:
    {{- include "starling.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing here talks to the Kubernetes API: services find each other through
# DNS and the config file, not through the cluster. No Role, and no token
# either.
automountServiceAccountToken: false
{{- end }}
