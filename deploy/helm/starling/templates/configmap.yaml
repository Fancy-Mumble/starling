{{- $full := include "starling.fullname" . -}}
{{- $ns := .Release.Namespace -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}
  labels:
    {{- include "starling.labels" . | nindent 4 }}
data:
  starling.toml: |
    # Generated by the starling Helm chart. Do not edit in place: the next
    # `helm upgrade` overwrites it. Change values.yaml.
    #
    # `--config` REPLACES the built-in defaults rather than merging with them,
    # so this file is complete on its own. A block left out is a service that
    # does not exist, not a service on its defaults.
    #
    # Unknown keys are rejected at startup, so a typo here fails loudly instead
    # of silently leaving a limit at its default.

    [runtime]
    # False in both modes. The all-in-one deployment passes `--all-in-one` on
    # the command line, which overrides this rather than needing a second file.
    all_in_one = false
    data_dir = {{ .Values.runtime.dataDir | quote }}

    {{- range .Values.instances }}

    [[instances]]
    id = {{ .id }}
    name = {{ .name | quote }}
    port = {{ .port }}
    {{- end }}

    # -- The gateway --------------------------------------------------------

    [gateway]
    # 0.0.0.0 because this is the one listener reached from outside the
    # cluster, through the Service.
    listen_tcp = "0.0.0.0:{{ .Values.gateway.service.port }}"
    control_queue = {{ .Values.gateway.controlQueue }}
    audio_queue = {{ .Values.gateway.audioQueue }}
    default_deadline = {{ .Values.gateway.defaultDeadline | quote }}
    breaker_failures = {{ .Values.gateway.breakerFailures }}
    breaker_cooldown = {{ .Values.gateway.breakerCooldown | quote }}

    [gateway.tls]
    {{- if .Values.gateway.tls.existingSecret }}
    # From the Secret named in gateway.tls.existingSecret. `directory` reads
    # these same two paths, because the fingerprint it publishes has to be the
    # one clients are actually shown.
    cert = "{{ .Values.gateway.tls.mountPath }}/tls.crt"
    key  = "{{ .Values.gateway.tls.mountPath }}/tls.key"
    {{- else }}
    # No certificate configured, so a self-signed pair is generated into
    # data_dir on first boot, as murmur does. That volume must survive a
    # restart: Mumble clients identify a server by certificate fingerprint, and
    # a fresh pair is what a man-in-the-middle also looks like.
    {{- end }}

    {{- range $bucket, $limit := .Values.gateway.limits }}

    [gateway.limits.{{ $bucket }}]
    rate = {{ $limit.rate | quote }}
    burst = {{ $limit.burst }}
    {{- end }}

    [gateway.resume]
    enabled = {{ .Values.gateway.resume.enabled }}
    ring = {{ .Values.gateway.resume.ring }}
    ttl = {{ .Values.gateway.resume.ttl | quote }}

    # -- Observability ------------------------------------------------------

    [telemetry]
    log_format = {{ .Values.telemetry.logFormat | quote }}
    {{- with .Values.telemetry.metrics }}
    metrics = {{ . | quote }}
    {{- end }}
    {{- with .Values.telemetry.otlpEndpoint }}
    otlp_endpoint = {{ . | quote }}
    {{- end }}

    # -- Services -----------------------------------------------------------
    {{- if eq .Values.mode "all-in-one" }}
    #
    # `inproc:` because every service is in one process here and calls never
    # leave it. This is not cosmetic: `endpoint` is what a service BINDS, in
    # all-in-one too, so an `http://` endpoint naming a Service that does not
    # exist would fail to resolve and take that service down at startup.
    {{- else }}
    #
    # `endpoint` is where every other service DIALS this one: a ClusterIP that
    # Kubernetes DNS resolves. It is not what the service binds - a ClusterIP
    # is virtual and belongs to no interface - so each workload sets its own
    # `bind` to 0.0.0.0 through STARLING_SERVICES_<NAME>_BIND. One line in the
    # pod spec, and it changes only where that one service listens.
    {{- end }}
    {{- range $name := (keys .Values.services | sortAlpha) }}
    {{- $svc := index $.Values.services $name }}
    {{- if $svc.enabled }}
    {{- $port := include "starling.grpcPort" (dict "name" $name "root" $) }}

    [services.{{ $name }}]
    {{- if not $svc.noEndpoint }}
    {{- if eq $.Values.mode "all-in-one" }}
    endpoint = "inproc:{{ $name }}"
    {{- else }}
    endpoint = "http://{{ $full }}-{{ $name }}.{{ $ns }}.svc:{{ $port }}"
    {{- end }}
    {{- end }}
    tier = {{ $svc.tier | quote }}
    types = {{ $svc.types | toJson }}
    {{- with $svc.limits }}
    limits = {{ . | quote }}
    {{- end }}
    {{- if eq $name "voice" }}
    # Voice's OWN socket: audio never passes through the gateway. The same port
    # number the gateway serves TCP on, because a legacy client sends UDP to
    # the host:port it made TCP to - so these two cannot drift apart, and
    # nothing here lets them.
    udp_listen = {{ default (printf "0.0.0.0:%v" $.Values.gateway.service.port) $svc.udpListen | quote }}
    {{- end }}
    {{- with $svc.listen }}
    listen = {{ . | quote }}
    {{- end }}
    {{- if eq $name "files" }}
    {{- if $svc.publicUrl }}
    public_url = {{ $svc.publicUrl | quote }}
    {{- else }}
    # In-cluster only. A client outside the cluster cannot resolve this, so
    # every signed URL handed out is unreachable to it. Set
    # services.files.publicUrl to the name clients actually use.
    public_url = "http://{{ $full }}-files.{{ $ns }}.svc:8080"
    {{- end }}
    {{- else }}
    {{- with $svc.publicUrl }}
    public_url = {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- with $svc.urlTtl }}
    url_ttl = {{ . | quote }}
    {{- end }}
    {{- with $svc.maxUpload }}
    max_upload = {{ . | quote }}
    {{- end }}
    {{- if and $svc.storage $svc.storage.url }}

    [services.{{ $name }}.storage]
    url = {{ $svc.storage.url | quote }}
    {{- with $svc.storage.maxConnections }}
    max_connections = {{ . }}
    {{- end }}
    {{- end }}
    {{- with $svc.extraToml }}

    {{ . | trim | nindent 4 }}
    {{- end }}
    {{- end }}
    {{- end }}

    {{- if .Values.operatorApi.enabled }}

    # -- The admin plane ----------------------------------------------------
    #
    # Needs BOTH `endpoint` and `listen`, unlike every other block: the runtime
    # serves a gRPC surface at `endpoint` for every service that does not opt
    # out, and the REST API is a second listener on top.

    [services.operator-api]
    enabled = true
    {{- if eq .Values.mode "all-in-one" }}
    endpoint = "inproc:operator-api"
    {{- else }}
    endpoint = "http://{{ $full }}-operator-api.{{ $ns }}.svc:50051"
    {{- end }}
    listen = {{ .Values.operatorApi.listen | quote }}
    tier = {{ .Values.operatorApi.tier | quote }}
    types = []

    [services.operator-api.auth]
    mode = {{ .Values.operatorApi.auth.mode | quote }}
    {{- if eq .Values.operatorApi.auth.mode "token" }}

    [services.operator-api.auth.token]
    # The variable's name, never the secret itself. It arrives from a Secret,
    # and an unset one is an unusable token rather than a known one: an empty
    # bearer token is refused as malformed before it is ever compared.
    tokens = [{ value_env = "STARLING_ADMIN_TOKEN", scopes = {{ .Values.operatorApi.auth.token.scopes | toJson }} }]
    {{- end }}

    [services.operator-api.audit]
    path = {{ .Values.operatorApi.audit.path | quote }}
    # Cannot be recorded -> it does not happen.
    fail_closed = {{ .Values.operatorApi.audit.failClosed }}
    {{- end }}
    {{- with .Values.extraToml }}

    # -- extraToml ----------------------------------------------------------
    {{ . | trim | nindent 4 }}
    {{- end }}
