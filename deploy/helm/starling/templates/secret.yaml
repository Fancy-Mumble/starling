{{- if and .Values.operatorApi.enabled (eq .Values.operatorApi.auth.mode "token") }}
{{- if and .Values.operatorApi.auth.token.value (not .Values.operatorApi.auth.token.existingSecret) }}
{{/*
Only when the token was given inline. Prefer operatorApi.auth.token.existingSecret:
a value passed to Helm is stored in the release and comes back out of
`helm get values`, which is not where the highest-privilege credential in the
system should be readable from.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "starling.fullname" . }}-admin
  labels:
    {{- include "starling.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.operatorApi.auth.token.existingSecretKey }}: {{ .Values.operatorApi.auth.token.value | quote }}
{{- end }}
{{- end }}
