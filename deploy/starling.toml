# NOT the file to copy. This one belongs to `docker-compose.yml`.
#
# If you are configuring a server, start from `../starling.example.toml`; for
# every key there is, see `../examples/reference.toml`.
#
# What this is: `docker-compose.yml` bind-mounts this file into all 22
# containers at /etc/starling/starling.toml, and each is told which service to
# be (`starling text --config /etc/starling/starling.toml`), so all of them
# share one routing table. It is not compiled into the binary and nothing reads
# it unless compose is what you are running. The *defaults* are what is built
# into the binary; a file only overlays them.
#
# Why it still names endpoints, when nothing else has to: every service here is
# in its own container, so the built-in endpoints -- Unix sockets, which exist
# only on the host that created them -- are unreachable. Rewriting them to
# `http://<compose service>:50051` is the whole reason this file exists.
# Everything else, tiers and routes and rate-limit buckets, is left to the
# defaults. Unknown keys are refused at startup, so a typo fails loudly.

[runtime]
# Named volume. The gateway's first-boot certificate lives here (clients trust a
# server by fingerprint, so it must survive restarts), as do the per-service
# SQLite files.
data_dir = "/var/lib/starling"

[[instances]]
id = 1
name = "Starling"
port = 64738

[telemetry]
# `docker compose logs` is a terminal; switch to "json" for a log collector.
log_format = "text"

# -- Services ---------------------------------------------------------------
#
# One block per container. `endpoint` is where the service both binds and is
# dialled (one address per service, no bind/advertise split), so the host must
# be the compose service name; Docker's resolver makes a container's own alias
# bind its own address.
#
# On a multi-network container that bind picks one network; override just that
# one with STARLING_SERVICES_TEXT_ENDPOINT=http://0.0.0.0:50051.
#
# The built-in endpoints are Unix sockets, which are unreachable from another
# container, so every service that is dialled is listed here. `directory` is not:
# it dials out and has no gRPC surface.

[services.session-lifecycle]
endpoint = "http://session-lifecycle:50051"

[services.session-view]
endpoint = "http://session-view:50051"

[services.permissions]
endpoint = "http://permissions:50051"

[services.metadata]
endpoint = "http://metadata:50051"

[services.userdata]
endpoint = "http://userdata:50051"

[services.server-config]
endpoint = "http://server-config:50051"

[services.voice]
endpoint = "http://voice:50051"
# Voice's own socket, bypassing the gateway. A legacy client sends UDP to the
# host:port it made TCP to, so compose maps this UDP 64738 to the host port the
# gateway's TCP 64738 is on.
#
# No `public_url`: setting it advertises an explicit voice endpoint to Fancy
# clients, which only helps once voice is reachable somewhere other than the
# gateway's address.
udp_listen = "0.0.0.0:64738"

[services.text]
endpoint = "http://text:50051"

[services.pchat]
endpoint = "http://pchat:50051"

[services.moderation]
endpoint = "http://moderation:50051"

[services.screenshare]
endpoint = "http://screenshare:50051"

[services.files]
endpoint = "http://files:50051"
# The HTTP listener uploads and downloads will use. Nothing binds it yet -- this
# service signs URLs and does not serve them in this build -- so the port compose
# publishes answers nothing until it does.
listen = "0.0.0.0:8080"
# What the signed URLs point at, i.e. what a client must reach, not what the
# container binds. Set this to your public name once the stack leaves localhost.
public_url = "http://localhost:8080"

[services.plugins]
endpoint = "http://plugins:50051"

[services.push]
endpoint = "http://push:50051"

[services.audit]
endpoint = "http://audit:50051"

[services.onboarding]
endpoint = "http://onboarding:50051"

[services.social]
endpoint = "http://social:50051"

[services.link-preview]
endpoint = "http://link-preview:50051"

[services.context-actions]
endpoint = "http://context-actions:50051"

# The gateway owns no wire type -- it routes them -- and nothing dials it for
# work, but it needs an endpoint so the health collector can reach it.
# Otherwise the process every client connects to is the one component missing
# from the health dashboard.
[services.gateway]
endpoint = "http://gateway:50051"

# Asks every service how it is every few seconds and holds the answers, so
# operator-api serves /v1/health from one place.
[services.health]
endpoint = "http://health:50051"

[services.directory.options]
# Where the public list's certificate is verified; Debian's path, as this image
# is. A missing bundle is a startup error rather than a silent unverified POST
# of a shared secret.
trust_store = "/etc/ssl/certs/ca-certificates.crt"

# -- The admin plane --------------------------------------------------------
#
# REST + OpenAPI, your own authentication, every action recorded before it
# happens. Off by default; the `admin` compose profile starts it.
#
# It needs BOTH `endpoint` and `listen`: an (empty) gRPC surface at `endpoint`
# like every service, and the REST API as a second listener.

[services.operator-api]
enabled = false
endpoint = "http://operator-api:50051"
listen = "0.0.0.0:8081"      # published as 127.0.0.1:8081 on the host only

[services.operator-api.auth]
mode = "token"

[services.operator-api.auth.token]
# The variable's name, never the secret. Compose passes it from the host; no
# default, so an unset variable is an unusable token, not a known one.
tokens = [{ value_env = "STARLING_ADMIN_TOKEN", scopes = ["*"] }]

[services.operator-api.audit]
path = "/var/lib/starling/operator-audit.log"
# Cannot be recorded -> it does not happen.
fail_closed = true
