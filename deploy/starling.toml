# Starling deployment config for docker compose: a gateway in front, each
# service in its own container behind it. Endpoints are `http://<name>:50051`
# rather than the Unix sockets of starling.example.toml, since the services are
# not co-located.
#
# Every container mounts this same file and is told which service to be
# (`starling text --config /etc/starling/starling.toml`), so all share one
# routing table. Unknown keys are rejected at startup, so a typo fails loudly.

[runtime]
# The 21-container deployment; the `all-in-one` compose profile passes
# `--all-in-one` to override this.
all_in_one = false
# Named volume: the gateway's first-boot certificate lives here (clients trust a
# server by fingerprint, so it must survive restarts), as do the per-service
# SQLite files.
data_dir = "/var/lib/starling"

[[virtual_servers]]
id = 1
name = "Starling"
port = 64738

# -- The gateway ------------------------------------------------------------

[gateway]
# 0.0.0.0: the one listener reached from outside the compose network.
listen_tcp = "0.0.0.0:64738"
# Per client; full = disconnect it. Dropping a control message desyncs a client
# silently, and unbounded queueing is a memory DoS.
control_queue = 4096
# Per client, tunnelled audio; full = drop oldest and count it.
audio_queue = 128
default_deadline = "5s"
# Shed a repeatedly-failing service at the door instead of waiting on it.
breaker_failures = 5
breaker_cooldown = "10s"

[gateway.tls]
# Omit both: a self-signed pair is generated in `data_dir` on first boot. Set
# both to use your own certificate.
# cert = "/etc/starling/tls/cert.pem"
# key  = "/etc/starling/tls/key.pem"

# Buckets are per route, never one shared, and a throttled message is reported
# rather than silently dropped.
[gateway.limits.control]
rate = "1/s"
burst = 5
[gateway.limits.signalling]
rate = "10/s"
burst = 20
[gateway.limits.plugin]
rate = "4/s"
burst = 15
[gateway.limits.acl]
# The ACL editor opens one query per channel, so a large tree emits a burst.
rate = "20/s"
burst = 60
[gateway.limits.chat]
# A person typing; losing a message they wrote is the worst failure here.
rate = "5/s"
burst = 20
[gateway.limits.audio]
# Speech is ~100 frames/s, so the control bucket would cut it off mid-sentence.
rate = "200/s"
burst = 400

# A reconnecting Fancy client replays only the gap, not a full re-flood; legacy
# clients cannot resume.
[gateway.resume]
enabled = true
ring = 256
ttl = "120s"

# -- Observability ----------------------------------------------------------

[telemetry]
# `docker compose logs` is a terminal; switch to "json" for a log collector.
log_format = "text"
# Neither binds a listener in this build (OTLP is recorded but spans stay local;
# nothing serves the metrics registry yet). Commented so enabling is deliberate.
# metrics = "0.0.0.0:9090"
# otlp_endpoint = "http://otel-collector:4317"

# -- Services ---------------------------------------------------------------
#
# One block per container. `endpoint` is where the service both binds and is
# dialled (one address per service, no bind/advertise split), so the host must
# be the compose service name; Docker's resolver makes a container's own alias
# bind its own address.
#
# On a multi-network container that bind picks one network; override just that
# one with STARLING_SERVICES_TEXT_ENDPOINT=http://0.0.0.0:50051.
#
# `types` is the outer message type, one set per service; a service's own types
# live in its nested envelope.

[services.session-lifecycle]
endpoint = "http://session-lifecycle:50051"
tier = "essential"
types = [0, 2, 3, 4, 5, 9, 15, 21, 22, 1000]

[services.session-view]
endpoint = "http://session-view:50051"
tier = "essential"
types = []                   # internal: no client-facing type

[services.permissions]
limits = "acl"                # editor bursts; not the 1/s control bucket
endpoint = "http://permissions:50051"
tier = "essential"
types = [12, 13, 20, 1001]

[services.metadata]
endpoint = "http://metadata:50051"
tier = "essential"
types = [6, 7, 1002]

[services.userdata]
endpoint = "http://userdata:50051"
tier = "essential"
types = [14, 18, 23, 1003]

[services.server-config]
endpoint = "http://server-config:50051"
tier = "essential"
types = [24, 25, 1013]

[services.voice]
endpoint = "http://voice:50051"
tier = "core"
types = [1, 19, 1004]        # UDPTunnel, VoiceTarget, Fancy envelope
# Voice's own socket, bypassing the gateway. A legacy client sends UDP to the
# host:port it made TCP to, so compose maps this UDP 64738 to the host port the
# gateway's TCP 64738 is on.
udp_listen = "0.0.0.0:64738"
limits = "audio"             # speech, not the 1/s control bucket
# No `public_url`: setting it advertises an explicit voice endpoint to Fancy
# clients, which only helps once voice is reachable somewhere other than the
# gateway's address.

[services.text]
limits = "chat"               # a person typing; not the 1/s control bucket
endpoint = "http://text:50051"
tier = "core"
types = [11, 1005]

[services.pchat]
endpoint = "http://pchat:50051"
tier = "core"
types = [1006]

[services.moderation]
endpoint = "http://moderation:50051"
tier = "core"
types = [8, 10, 1007]

[services.screenshare]
endpoint = "http://screenshare:50051"
tier = "optional"
types = [1008]
limits = "signalling"        # not the 1/s control bucket

[services.files]
endpoint = "http://files:50051"
tier = "optional"
types = [1009]
listen = "0.0.0.0:8080"      # its own HTTP listener, published by compose
# What the signed URLs point at, i.e. what a client must reach, not what the
# container binds. Set to your public name once the stack leaves localhost.
public_url = "http://localhost:8080"
url_ttl = "15m"
max_upload = "512MiB"

[services.plugins]
endpoint = "http://plugins:50051"
tier = "optional"
types = [26, 1010]
limits = "plugin"

[services.push]
endpoint = "http://push:50051"
tier = "optional"
types = [1011]

[services.audit]
endpoint = "http://audit:50051"
tier = "optional"
types = [1012]

[services.onboarding]
endpoint = "http://onboarding:50051"
tier = "optional"
types = [1014]

[services.social]
endpoint = "http://social:50051"
tier = "optional"
types = [1015]

[services.link-preview]
endpoint = "http://link-preview:50051"
tier = "optional"
types = [1016]

[services.context-actions]
endpoint = "http://context-actions:50051"
tier = "optional"
types = [16, 17, 1017]

# The gateway's own block. It owns no wire types (it routes them) and nothing
# dials it for work, but it needs an endpoint so the `health` collector can
# reach it -- otherwise the process every client connects to is the one
# component missing from the health dashboard.
[services.gateway]
enabled = true
endpoint = "http://gateway:50051"
# `core` (the default). A tier says what the gateway does while a service is
# unhealthy, so the gateway's own tier is one it would only consult about itself.
tier = "core"
types = []

# No `endpoint`: nothing dials it. It dials the public Mumble server list hourly
# and has no gRPC surface. Silent until `registry_name`, `registry_password` and
# `registry_url` are set in `server-config`.
[services.directory]
tier = "optional"
types = []

[services.directory.options]
# Where the public list's certificate is verified; Debian's path, as this image
# is. A missing bundle is a startup error rather than a silent unverified POST
# of a shared secret.
trust_store = "/etc/ssl/certs/ca-certificates.crt"

# Asks every service how it is every few seconds and holds the answers, so
# `operator-api` serves `/v1/health` from one place. It IS dialled, so it needs
# an endpoint; omit this block and the collector never starts, so `/v1/health`
# answers 502.
[services.health]
enabled = true
endpoint = "http://health:50051"
tier = "optional"
types = []

# -- Storage, per service ---------------------------------------------------
#
# Each service owns its schema; none reads another's. With no block, a SQLite
# file named after the service is used under `data_dir` (what every service
# above does). Point one at a real database when it outgrows that:
#
# [services.pchat.storage]
# url = "postgres://starling:@db/starling_pchat"
# max_connections = 16

# -- The admin plane --------------------------------------------------------
#
# The Ice replacement: REST + OpenAPI, your own authentication, every action
# recorded before it happens. Off by default and loopback-only when on (the
# opposite exposure to the gateway). The `admin` compose profile starts it.
#
# It needs BOTH `endpoint` and `listen`: an (empty) gRPC surface at `endpoint`
# like every service, and the REST API as a second listener.

[services.operator-api]
enabled = false
endpoint = "http://operator-api:50051"
listen = "0.0.0.0:8081"      # published as 127.0.0.1:8081 on the host only
tier = "optional"
types = []

[services.operator-api.auth]
mode = "token"               # oidc | jwt | mtls | token

[services.operator-api.auth.token]
# The variable's name, never the secret. Compose passes it from the host; no
# default, so an unset variable is an unusable token, not a known one.
tokens = [{ value_env = "STARLING_ADMIN_TOKEN", scopes = ["*"] }]

[services.operator-api.audit]
path = "/var/lib/starling/operator-audit.log"
# Cannot be recorded -> it does not happen.
fail_closed = true
