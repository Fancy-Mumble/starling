[package]
name = "starling-bus"
description = "QNX-style message bus: ports, priority lanes, per-lane overflow policy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `bytes` only. The bus is what everything else waits on, so it carries no
# dependency graph of its own — but it must speak the same payload type as the
# rest of Starling, or every envelope pays a copy at the boundary.
[dependencies]
bytes.workspace = true

[[example]]
name = "isolation"
path = "examples/isolation.rs"

[[example]]
name = "realtime"
path = "examples/realtime.rs"

[[example]]
name = "rendezvous"
path = "examples/rendezvous.rs"

[lints]
workspace = true
