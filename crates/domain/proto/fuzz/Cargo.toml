# Fuzzing harness for the frame decoder.
#
# Its own workspace (the empty `[workspace]` table below) so `cargo-fuzz`'s
# nightly-only `-Z` flags and sanitizer settings do not leak into the main
# build, and so `cargo build` at the repo root ignores it.
[package]
name = "starling-proto-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
starling-proto = { path = ".." }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[workspace]
