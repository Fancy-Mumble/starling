[package]
name = "starling-log"
description = "Server event log: structured records, pluggable sinks, non-blocking dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# No async runtime, and nothing that can fail at import: the log has to work when
# everything else is broken, and a component that can only report a failure while
# healthy is not much of a log.
#
# `serde` is the single exception, for `LogConfig`. Derive-only, no I/O, and
# format-agnostic — TOML, YAML and JSON all deserialise it — so it couples this
# crate to no file format. It is here because logging's schema is logging's
# business; the alternative was leaving it in the composition root.
[dependencies]
serde.workspace = true

[lints]
workspace = true
