[package]
name = "starling-model"
description = "Channel tree, users and permissions — pure logic, no I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `starling-proto` is the only dependency, and it is itself I/O-free: the model
# needs the wire `Version` type and nothing else. Adding async, sockets or a
# database here would defeat the point of the crate (PORTING-PLAN.md §2.1).
[dependencies]
serde.workspace = true
bitflags = { workspace = true }
starling-proto.workspace = true

[lints]
workspace = true
