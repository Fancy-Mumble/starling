[package]
name = "starling-server"
description = "The Starling server: core state actor, TLS listener and message handlers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
starling-proto.workspace = true
starling-model.workspace = true
starling-api.workspace = true
starling-crypto.workspace = true
starling-gate.workspace = true
starling-log.workspace = true

tokio.workspace = true
# `rustls` types are reached through `tokio_rustls::rustls`, so there is no
# direct dependency here - that also keeps the two from drifting to
# incompatible versions.
bytes.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
