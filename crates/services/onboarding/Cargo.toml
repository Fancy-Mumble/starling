[package]
name = "starling-onboarding"
description = "onboarding flows and the responses to them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# No `starling-proto`: onboarding is entirely a Fancy feature, so it touches no
# upstream Mumble message and the frozen surface stays out of its build.
starling-proto-fancy.workspace = true
starling-runtime.workspace = true
sqlx.workspace = true

prost.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Tests only, and deliberately. `grants` writes an ACL shape, and the only thing
# that decides whether that shape means anything is the evaluator that reads it.
# Asserting the bits by hand would assert my belief about ACL semantics, which
# is precisely the belief worth checking: a grant that reads as applied and
# evaluates to nothing is this repo's most common bug, not a hypothetical one.
# Runtime coupling between services stays gRPC-only; a dev-dependency crosses
# no such line.
starling-permissions.workspace = true

[lints]
workspace = true
