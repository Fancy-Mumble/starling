[package]
name = "starling-directory"
description = "what this server tells the outside world: the public server list"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
starling-proto-fancy.workspace = true
starling-runtime.workspace = true
starling-crypto.workspace = true

bytes.workspace = true
# `client` on top of the workspace's server-side features: this is the one crate
# that makes an outbound HTTP request rather than answering one.
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
http-body-util.workspace = true
rand.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
sha1.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tonic.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
