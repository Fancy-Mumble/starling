[package]
name = "starling-link-preview"
description = "server-side link previews, fetched with an SSRF guard"
version = "0.2.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
starling-proto-fancy.workspace = true
starling-runtime.workspace = true
# The SSRF-guarded client and its deny list. Shared with `gifs` rather than
# copied into it, so there is one list of private ranges and not two.
starling-outbound.workspace = true
# The picture shrinker. It moved out of this service so `files` could use
# it too: neither service may link the other (docs/ARCHITECTURE.md §4).
starling-imaging.workspace = true

prost.workspace = true
# For the `JSON-LD` a page publishes about itself - see `structured`. A
# hand-rolled reader over a document a stranger chose is what the HTML scanner
# in `parse` exists to avoid, and JSON has a parser worth using.
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The probe example shares the library's own log rather than printing beside
# it: one ordered account of a fetch instead of two interleaved ones.
tracing-subscriber.workspace = true
# A card is composed from two fetches, and testing that composition needs a
# server to fetch from. Dev-only, and checked to stay that way: see the
# `loopback` feature in `starling-outbound`.
starling-outbound = { workspace = true, features = ["loopback"] }
# Only to *build* the pictures the tests shrink. The shipping path reaches
# the decoder through `starling-imaging`; a fixture needs an encoder, which
# is a test concern and stays out of the artifact.
image.workspace = true

[lints]
workspace = true
