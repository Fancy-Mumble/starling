[package]
name = "starling-link-preview"
description = "server-side link previews, fetched with an SSRF guard"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
starling-proto-fancy.workspace = true
starling-runtime.workspace = true

bytes.workspace = true
# `client`, like `directory`: this is the second crate that makes an outbound
# request rather than answering one, and it makes it to a host a stranger named.
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
http-body-util.workspace = true
prost.workspace = true
rustls.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tonic.workspace = true
tracing.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
