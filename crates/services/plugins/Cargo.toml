[package]
name = "starling-plugins"
description = "the plugin host, and the opaque key/value capability plugins persist through"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `PluginDataTransmission` is an upstream Mumble type, not a Fancy one: the
# relay has to read its envelope to stamp the sender and honour the receiver
# list, even though the payload inside stays opaque.
starling-proto.workspace = true
starling-proto-fancy.workspace = true
starling-runtime.workspace = true

prost.workspace = true
tonic.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
