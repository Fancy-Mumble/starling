[package]
name = "starling-plugins"
description = "the plugin host, and the opaque key/value capability plugins persist through"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `PluginDataTransmission` is an upstream Mumble type, not a Fancy one: the
# relay has to read its envelope to stamp the sender and honour the receiver
# list, even though the payload inside stays opaque.
starling-proto.workspace = true
starling-proto-fancy.workspace = true
starling-runtime.workspace = true
# The host itself, which knows how to load a plugin binary and nothing about
# Starling. This crate is what closes that gap: it implements the bridge the
# host reaches the server through.
starling-plugin-host.workspace = true

prost.workspace = true
# `spawn_blocking`, which every call into the host goes through, and the
# `Handle` the bridge blocks on from the other side.
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
