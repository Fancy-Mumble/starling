syntax = "proto3";

// Operational configuration: everything murmur lets an operator change while
// the server runs. Deployment configuration is the TOML and is not here,
// docs/CONFIGURATION.md.
package starling.serverconfig.v1;

import "common.proto";

service ServerConfig {
  rpc Get(GetRequest) returns (Snapshot);
  rpc Set(SetRequest) returns (Snapshot);
  // Readers cache a snapshot rather than calling per request; this is the
  // subscription that keeps it fresh.
  rpc Watch(GetRequest) returns (stream Snapshot);

  // Livery: the presentation an operator supplies, carried beside the
  // settings rather than inside them. Its own trio because `SetRequest.fields`
  // is a flat list of names and a nested document under field-wise merge would
  // need dotted paths the merge does not do.
  rpc GetLivery(GetRequest) returns (Livery);
  rpc SetLivery(SetLiveryRequest) returns (Livery);
  rpc WatchLivery(GetRequest) returns (stream Livery);

  // Greeting: the conditional welcome graph. The same trio, for the same
  // reason - it is a nested document, not a flat field.
  rpc GetGreeting(GetRequest) returns (Greeting);
  rpc SetGreeting(SetGreetingRequest) returns (Greeting);
  rpc WatchGreeting(GetRequest) returns (stream Greeting);

  // Whether a bearer token is a short-lived operator ticket this service
  // minted, called by `operator-api` when its own configured authenticator
  // does not recognise a credential. `server-config` is the ticket authority
  // because minting one needs the control-channel session's live permissions,
  // which only a frame handler ever sees; `operator-api` never learns a
  // session id, only the token and what it is good for.
  rpc VerifyTicket(VerifyTicketRequest) returns (VerifyTicketReply);
}

message VerifyTicketRequest {
  // The bearer value exactly as it arrived in `Authorization`, unhashed: the
  // ticket store only ever persists a digest of it, so the raw value has to
  // travel here to be checked against one.
  string token = 1;
}

message VerifyTicketReply {
  bool valid = 1;
  // Empty when `valid` is false.
  string subject = 2;
  repeated string scopes = 3;
}

message GetRequest {
  starling.common.v1.Scope scope = 1;
}

message SetRequest {
  starling.common.v1.Scope scope = 1;
  starling.common.v1.Actor actor = 2;
  // Only the fields named here are written, so two operators editing different
  // settings do not overwrite each other.
  repeated string fields = 3;
  Snapshot values = 4;
}

message SetLiveryRequest {
  starling.common.v1.Scope scope = 1;
  starling.common.v1.Actor actor = 2;
  // As SetRequest.fields, over Livery's own field names.
  repeated string fields = 3;
  Livery values = 4;
}

// What a server says it looks like: banner, mark, motto, palette.
//
// Every field is optional and empty means "keep the client's", so an operator
// who sets only a tagline gets exactly that and nothing else changes. The
// gradation is the feature: most servers send some of this, few send all of
// it, and a client renders whatever subset arrived.
//
// Nothing here may reach a stylesheet as text and nothing here holds a URL a
// viewer's machine fetches; see docs/OPERATOR-API.md "Livery".
message Livery {
  uint32 instance = 1;
  // One per instance, bumped on every accepted SetLivery, as Snapshot.version.
  uint64 version = 2;
  // Truncated SHA-256 over the canonical JSON form, server-filled and ignored
  // as input. Sent in the UDP ping so a client can decide whether to refetch
  // without fetching. Advisory only: it travels unauthenticated.
  bytes digest = 3;

  // -- Words. --

  // Replaces the host in headings. Never replaces the address a client shows
  // beside it, which is what makes it safe to honour before authentication.
  string display_name = 10;
  string tagline = 11;
  // Plain text, rendered as plain text. There is deliberately no markup, no
  // stylesheet and no font field: each is a styling engine handed to whoever
  // runs the server.
  string motd = 12;
  repeated Tag tags = 13;
  string rules_url = 14;

  // -- Artwork. Keys into the files plane, never bytes, and never a URL to a
  //    host the client would have to trust. The keys are content hashes, so
  //    they carry the images' identity into the digest for free. --

  string banner_key = 20;
  string icon_key = 21;
  // Where to anchor a banner that has to crop, 0..100 each. The middle is the
  // default and is what an unset pair means.
  uint32 banner_focus_x = 22;
  uint32 banner_focus_y = 23;

  // -- Colour, opt-in separately from artwork. A palette per mode because a
  //    client picks light or dark from the user's own theme, and one accent
  //    tuned for dark would land unmodified on every light-theme user. --

  Palette dark = 30;
  Palette light = 31;

  // sRGB as "#rrggbb". Hex rather than a packed uint32 because empty has to
  // mean "keep the client's", and in a uint32 zero is black.
  message Palette {
    string accent = 1;
    string surface = 2;
    string aura_from = 3;
    string aura_to = 4;
  }

  // Tone, not colour. A per-tag hex would be a second unclamped colour channel
  // and would clash with whichever theme the viewer picked.
  message Tag {
    string label = 1;
    enum Tone {
      NEUTRAL = 0;
      OK = 1;
      WARN = 2;
      BAD = 3;
      ACCENT = 4;
    }
    Tone tone = 2;
    string href = 3;
  }
}

// One version per server instance, bumped on every accepted Set.
//
// A reader compares versions to know whether it missed an update; the value is
// meaningless across server instances.
message Snapshot {
  uint32 instance = 1;
  uint64 version = 2;

  string welcome_text = 10;
  string password = 11;
  uint32 max_users = 12;
  uint32 max_bandwidth = 13;
  uint32 text_message_length = 14;
  uint32 image_message_length = 15;
  bool allow_html = 16;
  bool allow_recording = 17;
  uint32 channel_nesting_limit = 18;
  uint32 channel_count_limit = 19;
  uint32 listeners_per_channel = 20;
  uint32 listeners_per_user = 21;
  bool cert_required = 22;
  uint32 log_days = 23;
  // murmur's leaky bucket, which silently drops when it is wrong
  // (docs/PORTING-PLAN.md R5). Carried here so the gateway can size its buckets.
  uint32 message_limit = 24;
  uint32 message_burst = 25;
  uint32 plugin_message_limit = 26;
  uint32 plugin_message_burst = 27;
  string registry_name = 28;
  bool obfuscate_ips = 29;

  // Whether this server answers an unauthenticated UDP ping with its version
  // and user counts. murmur's `allowping`, default true, and it gates two
  // things rather than one: the ping a server browser sends, and public-list
  // registration, which refuses to run without it, because a listing nobody
  // can measure is a dead entry.
  bool allow_ping = 30;
  // The rest of murmur's `register*` block. Operational rather than deployment
  // settings because murmur lets an operator change them while the server runs.
  //
  // `registry_password` is the shared secret that proves to the public list that
  // a later update concerns the same server as the first. It is a secret: never
  // read back, and never logged.
  string registry_password = 31;
  // The web page a listing links to. murmur refuses to register without one.
  string registry_url = 32;
  // The DNS name the list should reach this server at, when it differs from
  // whatever address the registration happens to arrive from.
  string registry_hostname = 33;
  // Free-text country or region. Optional in murmur, and omitted when empty.
  string registry_location = 34;
  // Whether a listener's volume adjustment is announced to every client or only
  // to the one that set it.
  //
  // murmur's `broadcastlistenervolumeadjustments`, and **off by default** as it
  // is there: how loudly somebody is listening to a room is their own business,
  // and the only client that has to know the number is the one applying it.
  // Operators turn it on for overlays and talking-UI tooling that render other
  // people's listeners.
  bool broadcast_listener_volume_adjustments = 35;
  // Occupants any one channel may hold, murmur's `usersperchannel`, zero for no
  // limit. A channel carrying its own `max_users` is governed by that instead;
  // this is the fallback for the ones that do not, never a second ceiling on
  // top (`vendor/server/src/murmur/Server.cpp:2799`).
  uint32 users_per_channel = 36;
  // Where a user lands when nothing better is known, murmur's `defaultchannel`.
  // Zero is the root, which is also what an id naming no channel falls back to.
  uint32 default_channel = 37;
  // Whether a registered user is put back where they were, murmur's
  // `rememberchannel`, and **on** as it is there.
  bool remember_channel = 38;
  // How long that memory lasts, in seconds since they disconnected. Zero, the
  // default, is forever.
  uint32 remember_channel_duration = 39;
  // Settings a later service adds, so an operator-facing knob does not need a
  // proto release to exist.
  map<string, string> extra = 40;
  // What a channel name and a user name may look like, murmur's `channelname`
  // and `username`. Matched whole rather than anywhere in the name, as murmur
  // anchors them (`Server.cpp:618`), and an **empty** pattern means no
  // restriction, which is how an operator turns the rule off.
  string channel_name_regex = 41;
  string user_name_regex = 42;
}

// -- Greeting -----------------------------------------------------------------
//
// The conditional welcome message, as the operator drew it: a graph of
// conditions about the arriving peer, combined through logic gates, ending at
// the greeting they are shown.
//
// Its own trio beside Livery, and for the same reason `serverconfig.proto:17`
// gives: `SetRequest.fields` is a flat list of names, and a nested document
// under field-wise merge would need dotted paths the merge does not do.
//
// A graph rather than an ordered rule list because that is what the operator
// authored. Flattening it here would throw away the layout the editor needs to
// draw it back, and would make the server's answer to "why did this person see
// that" untraceable to anything the operator recognises.

message Greeting {
  uint32 instance = 1;
  // One per instance, bumped on every accepted SetGreeting, as Snapshot.version.
  uint64 version = 2;
  // Truncated SHA-256 over the canonical form. Server-filled, ignored as input.
  bytes digest = 3;
  // Off means no client is shown anything. Kept rather than deleting the graph,
  // so an operator can turn it off without losing what they drew - the same
  // reasoning as `Flow.enabled`.
  bool enabled = 4;

  repeated GreetingNode nodes = 10;
  repeated GreetingEdge edges = 11;
  // Notes an operator left on the canvas. Nothing evaluates them and no client
  // is ever sent one; they are here so the *next* operator can read the
  // drawing. See `GreetingAnnotation`.
  repeated GreetingAnnotation annotations = 12;

  // Server-filled; ignored as input.
  string updated_by = 20;
  uint64 updated_at_ms = 21;
}

// Which input a wire lands on. A condition has no inputs; a gate has A and B
// (A alone for NOT); the greeting has WHEN for its condition and PLUS for the
// reusable snippets appended to its body.
enum GreetingPort {
  GREETING_PORT_A = 0;
  GREETING_PORT_B = 1;
  GREETING_PORT_WHEN = 2;
  GREETING_PORT_PLUS = 3;
  // One of a design's declared inputs; `GreetingEdge.input` says which.
  GREETING_PORT_INPUT = 4;
}

// A note on the canvas: a title over a region, a paragraph of explanation, a
// one-line label, or a frame drawn behind a group of nodes.
//
// Deliberately outside `GreetingNode` rather than another arm of its `body`
// oneof. An annotation has no ports, takes part in no wire, and is read by
// nothing on the evaluation path - making it a node would put a thing with no
// truth value into every walk that asks a node whether it is true, and each of
// those walks would then need a case for "this one is furniture". It is a
// second layer over the same canvas, and it is stored as one.
//
// Layout is all it has, which is why none of it reaches `canonical`: a graph
// whose notes changed is the same rule, and a digest that moved with a note
// would re-prompt every user on the server because somebody documented their
// own canvas.
message GreetingAnnotation {
  string id = 1;
  int32 x = 2;
  int32 y = 3;
  // Zero means the editor's default for this kind. A frame with no size is
  // meaningless, so the editor gives one a size the moment it is drawn.
  uint32 w = 4;
  uint32 h = 5;
  Kind kind = 6;
  // Plain text, never markup. A note is read on the canvas by an operator, and
  // a second markup surface here would be a second thing to sanitise for no
  // reader who could not be served by a paragraph.
  string text = 7;
  // Which of the canvas's four marks it carries, so a region can be coloured
  // to match what it is about.
  Tone tone = 8;

  enum Kind {
    // A heading over a region: large text, no box around it.
    TITLE = 0;
    // A paragraph. What the group of nodes below it is for.
    NOTE = 1;
    // An outlined region drawn behind a group of nodes.
    FRAME = 2;
    // One line, for labelling a single wire or node.
    LABEL = 3;
  }

  enum Tone {
    TONE_MUTED = 0;
    TONE_ACCENT = 1;
    TONE_OK = 2;
    TONE_WARN = 3;
  }
}

// A greeting built from blocks, with a declared signature the graph fills.
//
// The server does three things with one: evaluates each condition input against
// the arriving peer, substitutes each text slot from the snippet wired to it,
// and concatenates the parts of whichever target that peer can render. There is
// no layout engine here and no markup generated here - `compiled` is produced
// by the editor, once, at save time.
message GreetingDesign {
  // What the block positions are relative to. Layout only; never evaluated.
  uint32 sheet_w = 1;
  // The signature. One port on the editor's node per entry.
  repeated DesignInput slots = 2;
  repeated DesignInput conditions = 3;
  // The blocks and their per-target overrides, as the editor's own JSON.
  //
  // Opaque here on purpose: it is what the editor reopens, and nothing on the
  // evaluation path reads it. Teaching the server to parse a layout would be a
  // second implementation of the editor, kept in step by hope.
  string tree = 4;
  // What each target compiles to. One entry per target that has any parts.
  repeated CompiledTarget compiled = 5;
  // The pictures this design draws, stored once each and referenced from the
  // markup by id.
  //
  // Out here rather than inside a part because a picture is not per-target: the
  // same photograph is drawn by every target that can draw one, and a copy per
  // target would be the same bytes several times over in the one place bytes
  // are most expensive.
  repeated GreetingAsset assets = 6;
}

// A picture a design carries.
//
// Raw bytes, and that is the whole point of the message existing. A greeting
// that has to travel inside a string can only carry a picture as a `data:` URI,
// which is base64 - a third more bytes for nothing, on a payload paid at every
// join - and it has to fit the 4096-character cap that string is held to. Sent
// as bytes to the clients that can receive bytes, a picture costs what the
// picture costs.
message GreetingAsset {
  // Referenced from the markup as `fm-a-<id>`. Stable across saves, so a design
  // that is edited does not invalidate every reader's cache of its artwork.
  string id = 1;
  // `image/webp`, `image/jpeg`, `image/png`. The client renders by this rather
  // than by sniffing, and refuses one it does not know.
  string mime = 2;
  // The picture. Never base64, never a URL: a URL would be fetched by every
  // reader, which is the tracking vector `data:` was chosen to close.
  bytes data = 3;
}

message DesignInput {
  // Stable. Wires bind to the *name*, so this is for the editor's own use.
  string id = 1;
  // What the port says, and what a slot or a gate refers to: `rules`.
  string name = 2;
}

message CompiledTarget {
  // `plain`, `rich`, `html` or `qt`. A string rather than an enum because the
  // set is the *editor's* to grow, and a server that dropped a target it had
  // never heard of would silently stop greeting the clients it was for.
  string target = 1;
  repeated DesignPart parts = 2;
}

// One piece of a compiled greeting.
//
// A list rather than one string, because two things are only known when
// somebody actually connects: which gated blocks are on, and what is wired into
// each slot. Splitting the output at every such boundary is the smallest thing
// that lets the server assemble without rendering.
message DesignPart {
  oneof body {
    // Markup or text, already generated.
    string literal = 1;
    // The name of a text input: substitute whatever is wired to it.
    string slot = 2;
  }
  // The name of a condition input. Empty means the part is always sent.
  string visible_if = 3;
}

message GreetingEdge {
  string id = 1;
  // Both are `GreetingNode.id`. A wire whose ends do not both resolve is
  // dropped at validation rather than at evaluation: a dangling wire is a
  // drawing mistake, and the operator is told at the moment they save.
  string from = 2;
  string to = 3;
  GreetingPort port = 4;
  // Which design input this wire lands on, when `port` is INPUT.
  //
  // A name rather than an index: a design's ports are its declared inputs, and
  // an index would silently re-point every wire the moment somebody reorders
  // them.
  string input = 5;
}

message GreetingNode {
  string id = 1;
  // Where the operator put it, and how big they made it. Carried because the
  // editor has to redraw the graph exactly as it was left; the evaluator reads
  // none of the four.
  //
  // Zero width or height means "whatever the editor's default for this kind
  // is", which is what every node saved before this field existed has. A node
  // is not given a nominal default here, because the default belongs to the
  // editor that draws it and differs per kind.
  int32 x = 2;
  int32 y = 3;
  uint32 w = 4;
  uint32 h = 5;

  oneof body {
    CountryIn country = 10;
    Tenure tenure = 11;
    ClientVersion client_version = 12;
    AccountIs account = 13;
    GroupIs group = 14;
    OperatingSystem os = 15;
    Gate gate = 16;
    Snippet snippet = 17;
    Greet greet = 18;
    Filter filter = 19;
    FancyVersion fancy_version = 20;
  }

  // ISO-3166-1 alpha-2, upper case. Matching needs a GeoIP database; where the
  // server has none the condition is skipped, never treated as false - see the
  // fail-open rule on `Greet`.
  message CountryIn {
    repeated string codes = 1;
  }

  // How long this account has existed, from `Account.created_at_ms`. A guest
  // has no account and so no tenure, which is a skip rather than a zero.
  message Tenure {
    enum Op {
      JOINED_LESS_THAN = 0;
      JOINED_MORE_THAN = 1;
    }
    Op op = 1;
    uint64 window_s = 2;
  }

  // Against `Version.version_v2` as the peer announced it. The editor encodes
  // the operator's "1.5.0" into this; an operator never types the number,
  // because a hand-written literal that forgets the patch shift decodes to
  // something else entirely and the handshake completes either way.
  message ClientVersion {
    enum Op {
      LT = 0;
      LE = 1;
      EQ = 2;
      GE = 3;
      GT = 4;
    }
    Op op = 1;
    uint64 version = 2;
  }

  // Against `Version.fancy_version` - the fork's own version, which stock
  // Mumble never sends and which moves independently of `version_v2`.
  //
  // A second node rather than another op on `ClientVersion`, because the two
  // number different things: a Fancy build announces *both*, a Mumble
  // compatibility version and its own, and 0.4.0 of the fork is not older than
  // 1.5.0 of Mumble - the numbers are not on one line and comparing across
  // them is meaningless. An operator addressing "everyone on the fork's own
  // client, before the release that fixed X" has to be able to say which of
  // the two versions they mean.
  //
  // A peer that announced no fancy version answers *no* here, to every op
  // including `ANY` and including the `LT` ones. That is a definite answer and
  // not a skip: the whole server already reads a missing `fancy_version` as
  // "this is stock Mumble" - it is what gates every fork message - so this
  // node reads it the same way. `ClientVersion` differs on purpose, because a
  // zero there means the peer said nothing at all rather than that it said
  // something the server understands.
  message FancyVersion {
    enum Op {
      LT = 0;
      LE = 1;
      EQ = 2;
      GE = 3;
      GT = 4;
      // Any version of the fork's client at all. `version` is ignored, and
      // this is the op an operator reaches for: "is this one of ours" is the
      // question the node mostly gets asked, and spelling it `GE 0.0.0` reads
      // like a version comparison that happens to be vacuous.
      ANY = 5;
    }
    Op op = 1;
    uint64 version = 2;
  }

  message AccountIs {
    enum State {
      // No registered account. Read from the identity, never from `id != 0`:
      // the SuperUser is account 0, and that test calls them a guest.
      GUEST = 0;
      REGISTERED = 1;
      // Certificate chains to a configured CA.
      STRONG_CERT = 2;
    }
    State state = 1;
  }

  message GroupIs {
    string group = 1;
  }

  // Normalised, never the raw `Version.os` string. The two clients spell it
  // differently - the Fancy client sends `std::env::consts::OS` (lower case
  // `windows`/`macos`/`linux`) and stock Mumble sends its own capitalisation,
  // historically `X11` for Linux - so an operator matching on the raw string
  // picks one client and silently misses the other.
  message OperatingSystem {
    enum Os {
      WINDOWS = 0;
      MACOS = 1;
      LINUX = 2;
      BSD = 3;
      ANDROID = 4;
      IOS = 5;
    }
    Os os = 1;
  }

  // Turns a maybe into a yes or a no.
  //
  // Every condition here has three answers, not two: a server with no
  // geo-IP database cannot say which country somebody is in, and a guest
  // has no account age to compare. That third answer travels through the
  // gates, and a greeting fires only on a definite yes - which means an
  // unanswerable condition quietly withholds the greeting, and the
  // operator never sees why.
  //
  // This is where they say. It takes one input and always answers one of
  // two things, so everything downstream of it is decided. Which way it
  // resolves is the operator's call and it genuinely goes both ways:
  // "I could not tell where they are from, so not the German greeting"
  // is `UNKNOWN_IS_NO`, and "I could not tell whether their client is
  // current, so warn them anyway" is `UNKNOWN_IS_YES`.
  message Filter {
    enum Unknown {
      UNKNOWN_IS_NO = 0;
      UNKNOWN_IS_YES = 1;
    }
    Unknown unknown_becomes = 1;
  }

  // A gate takes *settled* answers only.
  //
  // Every input has to come from a Filter or from another gate, which
  // is checked when the graph is stored. A condition cannot be wired
  // straight in, and that is the whole rule: combining a maybe with
  // anything gives a maybe, so a single unanswerable condition would
  // quietly take the whole expression with it and the greeting would
  // go to nobody with nothing to show for it. Filters are where an
  // operator says what a maybe means; gates are downstream of that
  // decision, never upstream of it.
  //
  // The consequence worth stating: every gate's output is settled,
  // because every input to it was. Undecidedness lives strictly
  // between a condition and the first filter below it.
  message Gate {
    enum Kind {
      AND = 0;
      OR = 1;
      XOR = 2;
      // One input, on port A.
      NOT = 3;
      NAND = 4;
      NOR = 5;
      // Both or neither. Written XAND on some diagrams.
      XNOR = 6;
    }
    Kind kind = 1;
  }

  // A named paragraph appended to a greeting's body. Reusable so an operator
  // writing five greetings states the house rules once.
  message Snippet {
    string name = 1;
    string html = 2;
    string plain = 3;
  }

  // The terminal node: what the person actually reads.
  //
  // Three representations of one greeting, and none of them is redundant -
  // each is what some client can actually show:
  //
  // * `sections` is the welcome *screen*: a hero, prose, a call to action, a
  //   row of links. A client that understands it draws these natively, with
  //   its own type scale and its own buttons, so the greeting looks like part
  //   of the application rather than like a web page pasted into it - and a
  //   button can then be a button rather than an underlined word.
  // * `html` is the same greeting as markup, for every client that renders
  //   markup and knows nothing about sections. Generated by the editor from
  //   the sections when there are any.
  // * `plain` is the same greeting again as text. A server with `allow_html`
  //   off hands a client tags it renders literally, which turns a greeting
  //   into what looks like a broken server - the same reason
  //   `listener_warning` and `outdated_epoch_warning` each hold two literals.
  //   One body with server-side tag stripping reproduces that bug class.
  //
  // A client takes the richest form it understands. Unlike layout, all three
  // are part of the document digest: changing what somebody reads is exactly
  // what "show it again" is for.
  message Greet {
    string html = 1;
    string plain = 2;
    // Shown once and then remembered per account. False shows it on every
    // connect and stores nothing.
    bool once = 3;
    repeated Section sections = 4;
    // Whether `html` is written for Qt's rich-text subset rather than for a
    // browser.
    //
    // Mumble 1.5 and older draw a greeting with `QTextDocument`, which renders
    // a subset of HTML 4 and CSS 2.1: no flexbox, no grid, no border-radius,
    // and layout done the way it was done in 2003 - with tables. Markup that
    // reads as a card in a modern client collapses into a left-aligned column
    // there, so an operator who cares about those clients writes a *second*
    // greeting for them and wires it behind a version condition.
    //
    // Carried because the editor cannot tell the two apart by looking: both
    // halves are markup, and one recompiled as the other on the next save
    // would silently undo the whole point of having written it.
    bool legacy = 5;
    // A greeting laid out in the design editor, rather than typed as prose.
    //
    // Both halves above are still filled in, generated from this: `html` and
    // `plain` are what a client that knows nothing about designs receives, and
    // are what this server sends when it has no better option.
    GreetingDesign design = 6;
  }

  // One band of a welcome screen, in the order they are drawn.
  //
  // A closed set rather than an arbitrary layout tree, and that is the whole
  // design. A tree of rows, columns and styles is a second CSS: the operator
  // gets to make an unreadable screen, every client has to implement a layout
  // engine to draw one, and the two drift. Six bands each with a fixed shape
  // means an operator picks *what this part is* and the client decides how
  // that looks in its own type scale - so a welcome screen matches the client
  // it is read in, on every platform, including ones written after it.
  message Section {
    Kind kind = 1;
    // The heading, the button's label, the eyebrow. What it means depends on
    // `kind`, and every kind that has one line uses this.
    string title = 2;
    // The second line: a hero's subtitle, a button's caption underneath.
    string subtitle = 3;
    // PROSE only: the paragraph, as markup.
    string html = 4;
    // Where an ACTION points. http(s) only; a client refuses anything else,
    // as it does for every other link a server sends.
    string url = 5;
    // HERO only. One or two characters - an emoji, a letter - drawn in the
    // badge above the title. Not an image: a picture here is paid for on
    // every join and there is a livery icon already.
    string glyph = 6;
    // CARDS only.
    repeated Card cards = 7;
    // ACTION only: whether it is drawn as the screen's primary button.
    bool primary = 8;
    // How this band sits. Alignment is the one layout choice an operator
    // genuinely has to make - a centred hero and a left-aligned paragraph are
    // both right, and neither can be guessed from the kind.
    Align align = 9;
    // What this band is *for*, painted as its background. A title bar and a
    // "registration is closed" notice are the same band with different tones,
    // and giving an operator a colour picker instead would let them build one
    // nobody can read on a theme they have never seen.
    Tone tone = 10;
    // IMAGE only: which of the server's own pictures to draw. Its livery,
    // never bytes carried here - the artwork already exists, is already
    // cached, and costs this document nothing.
    Picture picture = 11;
    // CARDS only: a centred list of links rather than a row of boxes.
    bool compact = 12;

    enum Align {
      // Whatever the band's kind is normally drawn as.
      ALIGN_DEFAULT = 0;
      ALIGN_LEFT = 1;
      ALIGN_CENTER = 2;
    }

    enum Tone {
      // No background at all: the band sits on the screen's own surface.
      TONE_NONE = 0;
      TONE_ACCENT = 1;
      TONE_MUTED = 2;
      TONE_WARN = 3;
      // For something that is actually wrong - registration closed, a service
      // down - rather than for emphasis.
      TONE_DANGER = 4;
    }

    enum Picture {
      PICTURE_NONE = 0;
      PICTURE_ICON = 1;
      PICTURE_BANNER = 2;
    }

    enum Kind {
      // A small strip across the top: the server's name, a version.
      HEADER = 0;
      // The badge, the big title, the line under it.
      HERO = 1;
      // A paragraph or several, as markup.
      PROSE = 2;
      // A button, with an optional line under it.
      ACTION = 3;
      // A row of small link cards.
      CARDS = 4;
      // A rule between bands.
      DIVIDER = 5;
      // The server's own artwork, from its livery.
      IMAGE = 6;
    }

    message Card {
      // The small caps line above the link: "BROWSE", "LIVE".
      string eyebrow = 1;
      string label = 2;
      string url = 3;
    }
  }
}

message SetGreetingRequest {
  starling.common.v1.Scope scope = 1;
  starling.common.v1.Actor actor = 2;
  Greeting values = 3;
}
