syntax = "proto3";

// Operational configuration: everything murmur lets an operator change while
// the server runs. Deployment configuration is the TOML and is not here,
// docs/CONFIGURATION.md.
package starling.serverconfig.v1;

import "common.proto";

service ServerConfig {
  rpc Get(GetRequest) returns (Snapshot);
  rpc Set(SetRequest) returns (Snapshot);
  // Readers cache a snapshot rather than calling per request; this is the
  // subscription that keeps it fresh.
  rpc Watch(GetRequest) returns (stream Snapshot);

  // Livery: the presentation an operator supplies, carried beside the
  // settings rather than inside them. Its own trio because `SetRequest.fields`
  // is a flat list of names and a nested document under field-wise merge would
  // need dotted paths the merge does not do.
  rpc GetLivery(GetRequest) returns (Livery);
  rpc SetLivery(SetLiveryRequest) returns (Livery);
  rpc WatchLivery(GetRequest) returns (stream Livery);

  // Greeting: the conditional welcome graph. The same trio, for the same
  // reason - it is a nested document, not a flat field.
  rpc GetGreeting(GetRequest) returns (Greeting);
  rpc SetGreeting(SetGreetingRequest) returns (Greeting);
  rpc WatchGreeting(GetRequest) returns (stream Greeting);

  // Whether a bearer token is a short-lived operator ticket this service
  // minted, called by `operator-api` when its own configured authenticator
  // does not recognise a credential. `server-config` is the ticket authority
  // because minting one needs the control-channel session's live permissions,
  // which only a frame handler ever sees; `operator-api` never learns a
  // session id, only the token and what it is good for.
  rpc VerifyTicket(VerifyTicketRequest) returns (VerifyTicketReply);
}

message VerifyTicketRequest {
  // The bearer value exactly as it arrived in `Authorization`, unhashed: the
  // ticket store only ever persists a digest of it, so the raw value has to
  // travel here to be checked against one.
  string token = 1;
}

message VerifyTicketReply {
  bool valid = 1;
  // Empty when `valid` is false.
  string subject = 2;
  repeated string scopes = 3;
}

message GetRequest {
  starling.common.v1.Scope scope = 1;
}

message SetRequest {
  starling.common.v1.Scope scope = 1;
  starling.common.v1.Actor actor = 2;
  // Only the fields named here are written, so two operators editing different
  // settings do not overwrite each other.
  repeated string fields = 3;
  Snapshot values = 4;
}

message SetLiveryRequest {
  starling.common.v1.Scope scope = 1;
  starling.common.v1.Actor actor = 2;
  // As SetRequest.fields, over Livery's own field names.
  repeated string fields = 3;
  Livery values = 4;
}

// What a server says it looks like: banner, mark, motto, palette.
//
// Every field is optional and empty means "keep the client's", so an operator
// who sets only a tagline gets exactly that and nothing else changes. The
// gradation is the feature: most servers send some of this, few send all of
// it, and a client renders whatever subset arrived.
//
// Nothing here may reach a stylesheet as text and nothing here holds a URL a
// viewer's machine fetches; see docs/OPERATOR-API.md "Livery".
message Livery {
  uint32 instance = 1;
  // One per instance, bumped on every accepted SetLivery, as Snapshot.version.
  uint64 version = 2;
  // Truncated SHA-256 over the canonical JSON form, server-filled and ignored
  // as input. Sent in the UDP ping so a client can decide whether to refetch
  // without fetching. Advisory only: it travels unauthenticated.
  bytes digest = 3;

  // -- Words. --

  // Replaces the host in headings. Never replaces the address a client shows
  // beside it, which is what makes it safe to honour before authentication.
  string display_name = 10;
  string tagline = 11;
  // Plain text, rendered as plain text. There is deliberately no markup, no
  // stylesheet and no font field: each is a styling engine handed to whoever
  // runs the server.
  string motd = 12;
  repeated Tag tags = 13;
  string rules_url = 14;

  // -- Artwork. Keys into the files plane, never bytes, and never a URL to a
  //    host the client would have to trust. The keys are content hashes, so
  //    they carry the images' identity into the digest for free. --

  string banner_key = 20;
  string icon_key = 21;
  // Where to anchor a banner that has to crop, 0..100 each. The middle is the
  // default and is what an unset pair means.
  uint32 banner_focus_x = 22;
  uint32 banner_focus_y = 23;

  // -- Colour, opt-in separately from artwork. A palette per mode because a
  //    client picks light or dark from the user's own theme, and one accent
  //    tuned for dark would land unmodified on every light-theme user. --

  Palette dark = 30;
  Palette light = 31;

  // sRGB as "#rrggbb". Hex rather than a packed uint32 because empty has to
  // mean "keep the client's", and in a uint32 zero is black.
  message Palette {
    string accent = 1;
    string surface = 2;
    string aura_from = 3;
    string aura_to = 4;
  }

  // Tone, not colour. A per-tag hex would be a second unclamped colour channel
  // and would clash with whichever theme the viewer picked.
  message Tag {
    string label = 1;
    enum Tone {
      NEUTRAL = 0;
      OK = 1;
      WARN = 2;
      BAD = 3;
      ACCENT = 4;
    }
    Tone tone = 2;
    string href = 3;
  }
}

// One version per server instance, bumped on every accepted Set.
//
// A reader compares versions to know whether it missed an update; the value is
// meaningless across server instances.
message Snapshot {
  uint32 instance = 1;
  uint64 version = 2;

  string welcome_text = 10;
  string password = 11;
  uint32 max_users = 12;
  uint32 max_bandwidth = 13;
  uint32 text_message_length = 14;
  uint32 image_message_length = 15;
  bool allow_html = 16;
  bool allow_recording = 17;
  uint32 channel_nesting_limit = 18;
  uint32 channel_count_limit = 19;
  uint32 listeners_per_channel = 20;
  uint32 listeners_per_user = 21;
  bool cert_required = 22;
  uint32 log_days = 23;
  // murmur's leaky bucket, which silently drops when it is wrong
  // (docs/PORTING-PLAN.md R5). Carried here so the gateway can size its buckets.
  uint32 message_limit = 24;
  uint32 message_burst = 25;
  uint32 plugin_message_limit = 26;
  uint32 plugin_message_burst = 27;
  string registry_name = 28;
  bool obfuscate_ips = 29;

  // Whether this server answers an unauthenticated UDP ping with its version
  // and user counts. murmur's `allowping`, default true, and it gates two
  // things rather than one: the ping a server browser sends, and public-list
  // registration, which refuses to run without it, because a listing nobody
  // can measure is a dead entry.
  bool allow_ping = 30;
  // The rest of murmur's `register*` block. Operational rather than deployment
  // settings because murmur lets an operator change them while the server runs.
  //
  // `registry_password` is the shared secret that proves to the public list that
  // a later update concerns the same server as the first. It is a secret: never
  // read back, and never logged.
  string registry_password = 31;
  // The web page a listing links to. murmur refuses to register without one.
  string registry_url = 32;
  // The DNS name the list should reach this server at, when it differs from
  // whatever address the registration happens to arrive from.
  string registry_hostname = 33;
  // Free-text country or region. Optional in murmur, and omitted when empty.
  string registry_location = 34;
  // Whether a listener's volume adjustment is announced to every client or only
  // to the one that set it.
  //
  // murmur's `broadcastlistenervolumeadjustments`, and **off by default** as it
  // is there: how loudly somebody is listening to a room is their own business,
  // and the only client that has to know the number is the one applying it.
  // Operators turn it on for overlays and talking-UI tooling that render other
  // people's listeners.
  bool broadcast_listener_volume_adjustments = 35;
  // Occupants any one channel may hold, murmur's `usersperchannel`, zero for no
  // limit. A channel carrying its own `max_users` is governed by that instead;
  // this is the fallback for the ones that do not, never a second ceiling on
  // top (`vendor/server/src/murmur/Server.cpp:2799`).
  uint32 users_per_channel = 36;
  // Where a user lands when nothing better is known, murmur's `defaultchannel`.
  // Zero is the root, which is also what an id naming no channel falls back to.
  uint32 default_channel = 37;
  // Whether a registered user is put back where they were, murmur's
  // `rememberchannel`, and **on** as it is there.
  bool remember_channel = 38;
  // How long that memory lasts, in seconds since they disconnected. Zero, the
  // default, is forever.
  uint32 remember_channel_duration = 39;
  // Settings a later service adds, so an operator-facing knob does not need a
  // proto release to exist.
  map<string, string> extra = 40;
  // What a channel name and a user name may look like, murmur's `channelname`
  // and `username`. Matched whole rather than anywhere in the name, as murmur
  // anchors them (`Server.cpp:618`), and an **empty** pattern means no
  // restriction, which is how an operator turns the rule off.
  string channel_name_regex = 41;
  string user_name_regex = 42;
}

// -- Greeting -----------------------------------------------------------------
//
// The conditional welcome message, as the operator drew it: a graph of
// conditions about the arriving peer, combined through logic gates, ending at
// the greeting they are shown.
//
// Its own trio beside Livery, and for the same reason `serverconfig.proto:17`
// gives: `SetRequest.fields` is a flat list of names, and a nested document
// under field-wise merge would need dotted paths the merge does not do.
//
// A graph rather than an ordered rule list because that is what the operator
// authored. Flattening it here would throw away the layout the editor needs to
// draw it back, and would make the server's answer to "why did this person see
// that" untraceable to anything the operator recognises.

message Greeting {
  uint32 instance = 1;
  // One per instance, bumped on every accepted SetGreeting, as Snapshot.version.
  uint64 version = 2;
  // Truncated SHA-256 over the canonical form. Server-filled, ignored as input.
  bytes digest = 3;
  // Off means no client is shown anything. Kept rather than deleting the graph,
  // so an operator can turn it off without losing what they drew - the same
  // reasoning as `Flow.enabled`.
  bool enabled = 4;

  repeated GreetingNode nodes = 10;
  repeated GreetingEdge edges = 11;

  // Server-filled; ignored as input.
  string updated_by = 20;
  uint64 updated_at_ms = 21;
}

// Which input a wire lands on. A condition has no inputs; a gate has A and B
// (A alone for NOT); the greeting has WHEN for its condition and PLUS for the
// reusable snippets appended to its body.
enum GreetingPort {
  GREETING_PORT_A = 0;
  GREETING_PORT_B = 1;
  GREETING_PORT_WHEN = 2;
  GREETING_PORT_PLUS = 3;
}

message GreetingEdge {
  string id = 1;
  // Both are `GreetingNode.id`. A wire whose ends do not both resolve is
  // dropped at validation rather than at evaluation: a dangling wire is a
  // drawing mistake, and the operator is told at the moment they save.
  string from = 2;
  string to = 3;
  GreetingPort port = 4;
}

message GreetingNode {
  string id = 1;
  // Where the operator put it. Carried because the editor has to redraw the
  // graph exactly as it was left; the evaluator never reads either.
  int32 x = 2;
  int32 y = 3;

  oneof body {
    CountryIn country = 10;
    Tenure tenure = 11;
    ClientVersion client_version = 12;
    AccountIs account = 13;
    GroupIs group = 14;
    OperatingSystem os = 15;
    Gate gate = 16;
    Snippet snippet = 17;
    Greet greet = 18;
    Filter filter = 19;
  }

  // ISO-3166-1 alpha-2, upper case. Matching needs a GeoIP database; where the
  // server has none the condition is skipped, never treated as false - see the
  // fail-open rule on `Greet`.
  message CountryIn {
    repeated string codes = 1;
  }

  // How long this account has existed, from `Account.created_at_ms`. A guest
  // has no account and so no tenure, which is a skip rather than a zero.
  message Tenure {
    enum Op {
      JOINED_LESS_THAN = 0;
      JOINED_MORE_THAN = 1;
    }
    Op op = 1;
    uint64 window_s = 2;
  }

  // Against `Version.version_v2` as the peer announced it. The editor encodes
  // the operator's "1.5.0" into this; an operator never types the number,
  // because a hand-written literal that forgets the patch shift decodes to
  // something else entirely and the handshake completes either way.
  message ClientVersion {
    enum Op {
      LT = 0;
      LE = 1;
      EQ = 2;
      GE = 3;
      GT = 4;
    }
    Op op = 1;
    uint64 version = 2;
  }

  message AccountIs {
    enum State {
      // No registered account. Read from the identity, never from `id != 0`:
      // the SuperUser is account 0, and that test calls them a guest.
      GUEST = 0;
      REGISTERED = 1;
      // Certificate chains to a configured CA.
      STRONG_CERT = 2;
    }
    State state = 1;
  }

  message GroupIs {
    string group = 1;
  }

  // Normalised, never the raw `Version.os` string. The two clients spell it
  // differently - the Fancy client sends `std::env::consts::OS` (lower case
  // `windows`/`macos`/`linux`) and stock Mumble sends its own capitalisation,
  // historically `X11` for Linux - so an operator matching on the raw string
  // picks one client and silently misses the other.
  message OperatingSystem {
    enum Os {
      WINDOWS = 0;
      MACOS = 1;
      LINUX = 2;
      BSD = 3;
      ANDROID = 4;
      IOS = 5;
    }
    Os os = 1;
  }

  // Turns a maybe into a yes or a no.
  //
  // Every condition here has three answers, not two: a server with no
  // geo-IP database cannot say which country somebody is in, and a guest
  // has no account age to compare. That third answer travels through the
  // gates, and a greeting fires only on a definite yes - which means an
  // unanswerable condition quietly withholds the greeting, and the
  // operator never sees why.
  //
  // This is where they say. It takes one input and always answers one of
  // two things, so everything downstream of it is decided. Which way it
  // resolves is the operator's call and it genuinely goes both ways:
  // "I could not tell where they are from, so not the German greeting"
  // is `UNKNOWN_IS_NO`, and "I could not tell whether their client is
  // current, so warn them anyway" is `UNKNOWN_IS_YES`.
  message Filter {
    enum Unknown {
      UNKNOWN_IS_NO = 0;
      UNKNOWN_IS_YES = 1;
    }
    Unknown unknown_becomes = 1;
  }

  // A gate takes *settled* answers only.
  //
  // Every input has to come from a Filter or from another gate, which
  // is checked when the graph is stored. A condition cannot be wired
  // straight in, and that is the whole rule: combining a maybe with
  // anything gives a maybe, so a single unanswerable condition would
  // quietly take the whole expression with it and the greeting would
  // go to nobody with nothing to show for it. Filters are where an
  // operator says what a maybe means; gates are downstream of that
  // decision, never upstream of it.
  //
  // The consequence worth stating: every gate's output is settled,
  // because every input to it was. Undecidedness lives strictly
  // between a condition and the first filter below it.
  message Gate {
    enum Kind {
      AND = 0;
      OR = 1;
      XOR = 2;
      // One input, on port A.
      NOT = 3;
      NAND = 4;
      NOR = 5;
      // Both or neither. Written XAND on some diagrams.
      XNOR = 6;
    }
    Kind kind = 1;
  }

  // A named paragraph appended to a greeting's body. Reusable so an operator
  // writing five greetings states the house rules once.
  message Snippet {
    string name = 1;
    string html = 2;
    string plain = 3;
  }

  // The terminal node: what the person actually reads.
  //
  // Both `html` and `plain` are carried, and this is not redundancy. A server
  // with `allow_html` off hands a client tags it renders literally, which turns
  // a greeting into what looks like a broken server - the same reason
  // `listener_warning` and `outdated_epoch_warning` each hold two literals.
  // One body with server-side tag stripping reproduces that bug class.
  message Greet {
    string html = 1;
    string plain = 2;
    // Shown once and then remembered per account. False shows it on every
    // connect and stores nothing.
    bool once = 3;
  }
}

message SetGreetingRequest {
  starling.common.v1.Scope scope = 1;
  starling.common.v1.Actor actor = 2;
  Greeting values = 3;
}
