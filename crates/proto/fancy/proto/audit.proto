syntax = "proto3";

// The operator-facing record of who did what.
//
// Entries are hash-chained: each carries the hash of the previous one, so a
// deletion from the middle is detectable rather than silent. This is the shape
// the existing audit plugin already stores (docs/STORAGE.md L5).
package starling.audit.v1;

import "common.proto";

service Audit {
  rpc Record(Entry) returns (RecordResult);
  rpc Query(QueryRequest) returns (EntryPage);
  rpc Verify(VerifyRequest) returns (VerifyResult);
}

message Entry {
  starling.common.v1.Scope scope = 1;
  // UUIDv7, assigned by the service, ignored on the way in.
  bytes id = 2;
  uint64 at_ms = 3;
  string category = 4;
  string action = 5;
  starling.common.v1.Actor actor = 6;
  string actor_name = 7;
  uint64 target_account = 8;
  uint32 target_channel = 9;
  string detail = 10;
  uint64 expires_at_ms = 11;
  // Set by a producer that may retry: a duplicate offset is accepted once and
  // then ignored, which is what the plugin's partial unique index buys.
  optional uint64 event_offset = 12;
}

message RecordResult {
  bytes id = 1;
  bytes entry_hash = 2;
  bool duplicate = 3;
}

message QueryRequest {
  starling.common.v1.Scope scope = 1;
  starling.common.v1.Actor actor = 2;
  uint64 since_ms = 3;
  uint64 until_ms = 4;
  string category = 5;
  uint64 target_account = 6;
  uint32 limit = 7;
  bytes before = 8;
}

message EntryPage {
  repeated Entry entries = 1;
  repeated bytes hashes = 2;
  bool more = 3;
}

message VerifyRequest {
  starling.common.v1.Scope scope = 1;
  starling.common.v1.Actor actor = 2;
}

message VerifyResult {
  bool intact = 1;
  uint64 checked = 2;
  // The first entry whose chain link does not hold, if any.
  bytes broken_at = 3;
}
