syntax = "proto3";

// ACL evaluation. Stateless, and scaled out by coalescing identical in-flight
// queries rather than by caching — docs/diagrams/scaling.puml.
package starling.permissions.v1;

import "common.proto";

service Permissions {
  rpc Effective(EffectiveRequest) returns (EffectiveResponse);
  rpc Check(CheckRequest) returns (starling.common.v1.Decision);
  // The check a service enforcing a client's action should use.
  //
  // Names a *session* rather than carrying a `Subject`, and that is the whole
  // point: `Check` lets its caller state who the subject is, so a caller that
  // built one carelessly — or was compromised — can assert
  // `account = 0, registered = true` and be told it is the SuperUser. Here the
  // caller supplies only the session id the frame arrived on, and this service
  // resolves the identity itself through `session-view`.
  //
  // `Check` remains for callers that legitimately hold an identity the session
  // view does not have: `operator-api` acting as an operator, and `session-view`
  // itself, which *is* the authority on who a session is.
  rpc CheckSession(SessionCheckRequest) returns (starling.common.v1.Decision);
  rpc GetAcl(AclRequest) returns (AclSet);
  rpc SetAcl(SetAclRequest) returns (AclResult);
  // Put somebody in a group without editing the ACL table.
  //
  // murmur's `addUserToGroup`/`removeUserFromGroup` (`MumbleServer.ice:728`),
  // whose whole point is what it is keyed on. Permanent membership is recorded
  // by *account* id, so an unregistered guest can never be in a named group by
  // any other means; a temporary membership may name a **session**, and that is
  // the only mechanism upstream has for the case.
  //
  // Deliberately not durable, exactly as upstream ("This state is not saved").
  // A session-scoped grant that survived a restart would be a grant attached to
  // a session id that now belongs to somebody else.
  rpc AddTemporaryGroup(TemporaryGroupRequest) returns (AclResult);
  rpc RemoveTemporaryGroup(TemporaryGroupRequest) returns (AclResult);
  // A revocation invalidates before it is acknowledged; a grant may arrive
  // lazily. A stale deny is safe, a stale grant is a security bug.
  rpc WatchInvalidations(starling.common.v1.Scope) returns (stream Invalidation);
}

message EffectiveRequest {
  starling.common.v1.Scope scope = 1;
  Subject subject = 2;
  uint32 channel = 3;
}

// Who the permissions are being evaluated for.
//
// A session and an account are not interchangeable: an unregistered guest has
// a session and no account, and an operator edits an account with no session.
message Subject {
  uint32 session = 1;
  // The registered account id — meaningful ONLY when `registered` is set.
  //
  // An unregistered subject carries 0 here, and 0 is also the SuperUser's id, so
  // reading this field alone identifies every guest as the administrator. Use
  // `starling_proto_fancy::identity` rather than comparing it directly.
  uint64 account = 2;
  string name = 3;
  // Whether `account` names a real account: murmur's `@auth` predicate,
  // `iId >= 0` (`vendor/server/src/Group.cpp:154`).
  //
  // Named `registered` and not `authenticated` on purpose. It was the latter,
  // and it was populated as "has a session id" — true for every connected
  // client — which put anonymous guests in `@auth` alongside registered users.
  // The field number is unchanged; only the name and its meaning are.
  bool registered = 4;
  // The access tokens the client presented, for `#token` group specifications.
  //
  // murmur's `ServerUser::qslAccessTokens`, matched **case-insensitively**
  // (`vendor/server/src/Group.cpp:16`) — a channel password typed with the
  // wrong capitalisation still opens the channel, and an operator who cased
  // the ACL entry differently from the password has not locked anybody out.
  repeated string tokens = 5;
  bytes cert_hash = 6;
  // The channel the subject is *in*, which is not the channel being evaluated.
  //
  // `in`, `out` and `sub` are the whole reason this is here: they compare where
  // the user is standing against the channel the ACL is being evaluated for, so
  // an evaluator that knows only the target cannot answer any of them
  // (`vendor/server/src/Group.cpp:158`).
  uint32 channel = 7;
  // Whether the subject's certificate chained to a configured CA.
  //
  // murmur's `bVerified`, and the `strong` group. False for the self-signed
  // certificate a stock Mumble client generates, which is the ordinary case —
  // so `strong` is the one predicate here that means "an authority vouched for
  // this", and it must never be inferred from merely *having* a certificate.
  bool strong_cert = 8;
}

message EffectiveResponse {
  // The 24-bit ChanACL::Perm set of ACL.h:21, including the Fancy additions.
  uint32 granted = 1;
  repeated string groups = 2;
}

message CheckRequest {
  starling.common.v1.Scope scope = 1;
  Subject subject = 2;
  uint32 channel = 3;
  uint32 permission = 4;
}

// "May the client on this session do this here?"
//
// The identity is deliberately absent: it is not the caller's to state.
message SessionCheckRequest {
  starling.common.v1.Scope scope = 1;
  // The session the frame arrived on. Zero — a client that has not finished
  // its handshake — resolves to nothing and is therefore denied.
  uint32 session = 2;
  uint32 channel = 3;
  // The bit being asked for. More than one bit means all of them are required.
  uint32 permission = 4;
  // Tokens that apply to **this check only**.
  //
  // murmur's `UserState.temporary_access_tokens` (`Messages.cpp:1133`): a
  // client sends the channel's password along with the request to enter it,
  // rather than storing it. Upstream adds them to the user for the duration of
  // one message and takes them away again in a destructor; carried on the
  // request here for the same reason, since writing them onto the session would
  // make a password typed once outlive the door it opened.
  repeated string temporary_tokens = 5;
}

message AclRequest {
  starling.common.v1.Scope scope = 1;
  uint32 channel = 2;
}

message AclSet {
  uint32 channel = 1;
  bool inherit = 2;
  repeated AclEntry acls = 3;
  repeated Group groups = 4;
}

message AclEntry {
  bool apply_here = 1;
  bool apply_subs = 2;
  bool inherited = 3;
  optional uint64 account = 4;
  optional string group = 5;
  uint32 grant = 6;
  uint32 deny = 7;
}

message Group {
  string name = 1;
  bool inherited = 2;
  bool inherit = 3;
  bool inheritable = 4;
  repeated uint64 add = 5;
  repeated uint64 remove = 6;
  repeated uint64 inherited_members = 7;
}

message SetAclRequest {
  starling.common.v1.Scope scope = 1;
  starling.common.v1.Actor actor = 2;
  AclSet acls = 3;
}

message AclResult {
  bool applied = 1;
  string refused = 2;
}

// One temporary group membership, added or removed.
message TemporaryGroupRequest {
  starling.common.v1.Scope scope = 1;
  starling.common.v1.Actor actor = 2;
  // The channel the group is declared on. The membership is scoped to it, and
  // reaches sub-channels only as far as the group's own `inheritable` allows.
  uint32 channel = 3;
  // The group name, without any of the `!~#$` prefixes — this names a group,
  // it is not a specification to be parsed.
  string group = 4;
  // Who holds it.
  //
  // A `oneof` rather than upstream's single integer set, where an account is a
  // positive number and a session is stored as its negation
  // (`vendor/server/src/Group.cpp:242`). That encoding has a real collision: an
  // unregistered user's account reads as `-1`, so upstream's own `session 1`
  // is indistinguishable from "any guest". Naming the two cases costs nothing
  // and cannot be got wrong.
  oneof member {
    // A registered account. Held until it is removed or the server restarts.
    uint64 account = 5;
    // A live session. Dropped the moment that session goes, because session ids
    // are reused (`vendor/server/src/murmur/Server.cpp:1904` re-queues them) and
    // a grant outliving its holder would be inherited by the next arrival.
    uint32 session = 6;
  }
}

// Which cached decisions a subscriber must throw away.
//
// An empty channel list means the whole tree: an ACL change on an inheriting
// parent can alter any descendant, and computing the exact set here would
// duplicate the evaluator in every subscriber.
message Invalidation {
  repeated uint32 channels = 1;
  repeated uint64 accounts = 2;
  bool everything = 3;
}
