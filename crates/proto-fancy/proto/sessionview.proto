syntax = "proto3";

// The composed live view of every connected session: the edge of the domain.
//
// Every service in the control, core and realtime groups reads here and
// nowhere else (docs/ARCHITECTURE.md §4). It forwards but never decides, and
// it is a subscription hub rather than a proxy — so nothing on the audio path
// makes a request.
package starling.sessionview.v1;

import "common.proto";

service SessionView {
  rpc Subscribe(SubscribeRequest) returns (stream ViewEvent);
  rpc Get(GetRequest) returns (Session);
  rpc List(SubscribeRequest) returns (Sessions);

  // session-lifecycle is the only writer: it owns a connection's existence.
  rpc Announce(Announcement) returns (starling.common.v1.Ack);

  // Cold queries are routed to the owning service untouched. Caching the
  // (user, channel) ACL cross product here would make this a second ACL
  // engine, which is exactly the line §4 draws.
  rpc Cold(ColdQuery) returns (ColdAnswer);
}

message SubscribeRequest {
  starling.common.v1.Scope scope = 1;
  string subscriber = 2;
}

message GetRequest {
  starling.common.v1.Scope scope = 1;
  uint32 session = 2;
}

message Session {
  uint32 session = 1;
  uint64 conn = 2;
  string gateway_id = 3;
  uint64 account = 4;
  string name = 5;
  uint32 channel = 6;
  repeated uint32 listening = 7;
  bool self_mute = 8;
  bool self_deaf = 9;
  bool mute = 10;
  bool deaf = 11;
  bool suppress = 12;
  bool priority_speaker = 13;
  bool recording = 14;
  uint64 fancy_version = 15;
  string address = 16;
  bytes cert_hash = 17;
  uint64 connected_at_ms = 18;
  uint32 max_bandwidth = 19;
  // Whether `account` above names a real account.
  //
  // Mumble uses `-1` for "not registered" and a uint64 cannot carry it, so this
  // is the presence bit and `account` means nothing without it — an anonymous
  // guest is written as `account = 0, registered = false`, and 0 is also the
  // SuperUser's id. Interpret the pair through
  // `starling_proto_fancy::identity`, never by comparing `account` directly.
  bool registered = 20;
  // The account's stored comment and avatar, as content hashes.
  //
  // Carried on the session because that is what the roster is built from: a
  // client learns of everyone else through `Session`, and a hash that stops
  // here is a profile picture nobody but its owner can see. The bodies stay in
  // `userdata`'s blob store and are fetched with `RequestBlob`, so a session
  // costs the same 20 bytes whether the avatar is 1 KiB or 500.
  //
  // Empty means the account has none — or that this is a guest, who has no
  // account to have stored one on.
  bytes comment_hash = 21;
  bytes texture_hash = 22;
  // The access tokens this client presented, for `#token` ACL groups.
  //
  // Here because `permissions` resolves a session through this view and nowhere
  // else (`docs/ARCHITECTURE.md` §4), and a token nothing can read is a channel
  // password that never opens anything.
  //
  // **These are secrets, and this is the one field of a `Session` that is.** A
  // channel password is typed by a user and shared between the people who may
  // enter. It travels to services and must never be composed into anything
  // client- or operator-facing: `session-lifecycle` builds no `UserState` from
  // it, and `operator-api`'s user JSON names its fields one by one so that
  // adding one here cannot leak into an HTTP response by default.
  repeated string tokens = 23;
  // Whether the peer's certificate chained to a configured CA — murmur's
  // `bVerified`, and the `strong` ACL group. Carried separately from
  // `cert_hash` because the hash is an identifier and this is an assurance.
  bool strong_cert = 24;
  // Per-listener gain, keyed by the channel in `listening` it applies to.
  //
  // Sparse: a listener that never moved the slider has no entry here, and
  // absent means unity. Separate from `listening` rather than a parallel array
  // because the two are written by different messages — a client can adjust a
  // volume without changing which channels it listens to, and a parallel array
  // that fell out of step would silence the wrong room.
  map<uint32, float> listening_volume = 25;
}

message Sessions {
  uint64 version = 1;
  repeated Session sessions = 2;
}

message ViewEvent {
  oneof event {
    Sessions snapshot = 1;
    Session upsert = 2;
    Gone gone = 3;
    // Republished whenever an authority changes something the view composes,
    // so a subscriber never has to poll.
    uint64 config_version = 4;
  }
}

message Gone {
  uint32 session = 1;
  string reason = 2;
}

message Announcement {
  starling.common.v1.Scope scope = 1;
  oneof what {
    Session up = 2;
    Gone down = 3;
    Session changed = 4;
  }
}

message ColdQuery {
  starling.common.v1.Scope scope = 1;
  oneof query {
    AclQuery acl = 2;
    AccountQuery account = 3;
  }
}

message AclQuery {
  uint32 session = 1;
  uint32 channel = 2;
  uint32 permission = 3;
}

message AccountQuery {
  oneof by {
    uint64 id = 1;
    string name = 2;
  }
}

message ColdAnswer {
  oneof answer {
    starling.common.v1.Decision decision = 1;
    Account account = 2;
  }
}

message Account {
  uint64 id = 1;
  string name = 2;
  bool found = 3;
}
