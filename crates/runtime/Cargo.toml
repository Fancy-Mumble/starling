[package]
name = "starling-runtime"
description = "What every Starling service needs: config, serving, health, drain, telemetry, storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
starling-proto.workspace = true
starling-proto-fancy.workspace = true

async-trait.workspace = true
prost.workspace = true


hyper-util.workspace = true

serde.workspace = true
# The admin API's configuration payloads, shared so both directions agree.
serde_json.workspace = true
# Only for the log's address pseudonyms; nothing here is a secret.
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tonic.workspace = true
tower = "0.5"
# The response-future wrapper in `inflight`: a guard has to live inside the
# future, and hand-rolled pin projection there would be unsafe code in a
# diagnostics path.
pin-project-lite = "0.2"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
