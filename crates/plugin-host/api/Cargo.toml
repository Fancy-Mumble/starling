# The plugin-facing contract. Lifted from the C++ server's
# `3rdparty/mumble-plugin-host/api` unchanged: the crate name, the ABI
# constants and every signature stay exactly as they were, so a plugin binary
# built against either tree loads in either server. Nothing here may be
# "tidied" without bumping `PLUGIN_ABI_VERSION`.
#
# Edition 2021, not the workspace's 2024: this is lifted code held to a
# published ABI, and an edition migration is a change to it. See
# `docs/PLUGIN-HOST-PLAN.md` §3.
[package]
name = "mumble-plugin-api"
version = "0.2.0"
edition = "2021"
publish = false
description = "Public, ABI-stable trait definitions for dynamically loadable Mumble server plugins"
license = "MIT"

[dependencies]
abi_stable.workspace = true
bitflags.workspace = true
mumble-plugin-api-derive = { path = "../api-derive", version = "0.2.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# `abi_stable`'s `#[sabi_trait]` proc-macro generates unsafe trait
# implementations that cannot be expressed safely. This crate and the host are
# the only two places in the tree where unsafe is needed, so the workspace-level
# `unsafe_code = "deny"` is relaxed here.
[lints.rust]
unsafe_code = "allow"
missing_docs = "deny"
unused_crate_dependencies = "warn"
unused_results = "deny"
missing_debug_implementations = "deny"
# `#[sabi_trait]` expands to qualified paths in supertrait bounds whose spans
# point back to the user-written `Send + Sync + 'static` clause, producing
# false-positive `unused_qualifications` warnings. Disabled here rather than
# papering over the macro emissions.
unused_qualifications = "allow"
# Same root cause for non-local impls: the macro generates trait impls inside an
# anonymous const item. A known upstream pattern.
non_local_definitions = "allow"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
excessive_nesting = "deny"
too_many_lines = "deny"
allow_attributes_without_reason = "deny"
expect_used = "warn"
