# The plugin-facing contract. Lifted from the C++ server's
# `3rdparty/mumble-plugin-host/api` unchanged: the crate name, the ABI
# constants and every signature stay exactly as they were, so a plugin binary
# built against either tree loads in either server. Nothing here may be
# "tidied" without bumping `PLUGIN_ABI_VERSION`.
#
# Edition 2021, not the workspace's 2024: this is lifted code held to a
# published ABI, and an edition migration is a change to it. See
# `docs/PLUGIN-HOST-PLAN.md` §3.
[package]
name = "mumble-plugin-api"
version = "0.2.0"
edition = "2021"
publish = false
description = "Public, ABI-stable trait definitions for dynamically loadable Mumble server plugins"
license = "MIT"

[dependencies]
abi_stable.workspace = true
bitflags.workspace = true
mumble-plugin-api-derive = { path = "../api-derive", version = "0.2.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# `abi_stable`'s `#[sabi_trait]` proc-macro generates unsafe trait
# implementations that cannot be expressed safely. This crate and the host are
# the only two places in the tree where unsafe is needed, so the workspace-level
# `unsafe_code = "deny"` is relaxed here.

[lints]
workspace = true
