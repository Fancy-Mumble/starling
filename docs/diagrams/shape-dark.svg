<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="601px" preserveAspectRatio="none" style="width:1295px;height:601px;background:#0D1117;" version="1.1" viewBox="0 0 1295 601" width="1295px" zoomAndPan="magnify"><title>The shape of it: four ways in, one of them through the gateway</title><defs/><g><rect width="100%" height="100%" fill="#0D1117"/><rect fill="#0D1117" height="601" style="stroke:none;stroke-width:1.0;" width="1295" x="0" y="0"/><text fill="#9198A1" font-family="Verdana" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="263.3057" x="317.8359" y="20.0537">THE TOP-LEVEL PICTURE, AND NOTHING ELSE.</text><text fill="#9198A1" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="198.6914" x="588.1729" y="20.0537">Every service and every message type:</text><text fill="#9198A1" font-family="Verdana" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="77.6465" x="790.3799" y="20.0537">services.puml</text><text fill="#9198A1" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="3.6377" x="868.0264" y="20.0537">.</text><text fill="#9198A1" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="42.6025" x="353.9565" y="32.207">Only the</text><text fill="#9198A1" font-family="Verdana" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="39.6826" x="400.0747" y="32.207">control</text><text fill="#9198A1" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="392.2705" x="443.2729" y="32.207">path is brokered. Realtime, bulk and admin traffic reach their service directly,</text><text fill="#9198A1" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="362.7588" x="413.3706" y="44.3604">so the gateway is never in the media path and cannot be its bottleneck.</text><text fill="#9198A1" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="51.2891" x="321.8594" y="56.5137">Rationale:</text><text fill="#9198A1" font-family="Verdana" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="108.3154" x="376.6641" y="56.5137">ARCHITECTURE.md</text><text fill="#9198A1" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="74.9121" x="484.9795" y="56.5137">.   Shard keys:</text><text fill="#9198A1" font-family="Verdana" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="71.1768" x="563.4072" y="56.5137">scaling.puml</text><text fill="#9198A1" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="91.6602" x="634.584" y="56.5137">.   Gateway parts:</text><text fill="#9198A1" font-family="Verdana" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="134.2432" x="729.7598" y="56.5137">gateway-internals.puml</text><text fill="#9198A1" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="3.6377" x="864.0029" y="56.5137">.</text><text fill="#E6EDF3" font-family="Verdana" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="782.8799" x="203.3101" y="96.7314">The shape of it: four ways in, one of them through the gateway</text><!--entity client--><g id="elem_client"><ellipse cx="744.0732" cy="133.3506" fill="#E3F2FD" rx="8" ry="8" style="stroke:#8B949E;stroke-width:1.0;"/><path d="M744.0732,141.3506 L744.0732,168.3506 M731.0732,149.3506 L757.0732,149.3506 M744.0732,168.3506 L731.0732,183.3506 M744.0732,168.3506 L757.0732,183.3506 " fill="none" style="stroke:#8B949E;stroke-width:1.0;"/><text fill="#E6EDF3" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="97.7949" x="695.1758" y="199.4258">Mumble client</text><text fill="#E6EDF3" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="128.1465" x="680" y="216.4404">&#171;legacy or Fancy&#187;</text></g><!--entity oper--><g id="elem_oper"><ellipse cx="1115.978" cy="141.8506" fill="#F3E5F5" rx="8" ry="8" style="stroke:#8B949E;stroke-width:1.0;"/><path d="M1115.978,149.8506 L1115.978,176.8506 M1102.978,157.8506 L1128.978,157.8506 M1115.978,176.8506 L1102.978,191.8506 M1115.978,176.8506 L1128.978,191.8506 " fill="none" style="stroke:#8B949E;stroke-width:1.0;"/><text fill="#E6EDF3" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="67.9561" x="1082" y="207.9258">operator</text></g><!--entity gw--><g id="elem_gw"><rect fill="#FFE9D6" height="71.0439" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="254.8896" x="34.5" y="326.8506"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="66.9922" x="128.4487" y="350.9258">gateway</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="148.1621" x="87.8638" y="367.9404">TLS &#183; framing &#183; limits</text><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="234.8896" x="44.5" y="384.9551">single writer per client socket</text></g><!--entity svc--><g id="elem_svc"><rect fill="#FAFAFA" height="71.0439" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="302.1328" x="11" y="522.3506"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="88.9766" x="92.2031" y="546.4258">21 services</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="50.75" x="181.1797" y="546.4258">, tiered</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="177.8984" x="73.1172" y="563.4404">essential &#183; core &#183; optional</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="282.1328" x="21" y="580.4551">&#171;gRPC, no client reaches them directly&#187;</text></g><!--entity voice--><g id="elem_voice"><rect fill="#E8F5E9" height="54.0293" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="154.9346" x="666.5" y="335.3506"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="41.0293" x="723.4526" y="359.4258">voice</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="134.9346" x="676.5" y="376.4404">its own UDP socket</text></g><!--entity files--><g id="elem_files"><rect fill="#E8F5E9" height="54.0293" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="189.3398" x="839.5" y="335.3506"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="33.0859" x="917.627" y="359.4258">files</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="169.3398" x="849.5" y="376.4404">signed URL, out of band</text></g><!--entity opapi--><g id="elem_opapi"><rect fill="#EDE7F6" height="71.0439" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="138.9316" x="1046.5" y="326.8506"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="98.6016" x="1066.665" y="350.9258">operator-api</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="118.9316" x="1056.5" y="367.9404">REST + OpenAPI</text><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="105.3965" x="1063.2676" y="384.9551">off by default</text></g><g id="elem_GMN14"><path d="M308,274.3506 L308,358.3506 L289.7578,362.3506 L308,366.3506 L308,450.3438 A0,0 0 0 0 308,450.3438 L647.6904,450.3438 A0,0 0 0 0 647.6904,450.3438 L647.6904,284.3506 L637.6904,274.3506 L308,274.3506 A0,0 0 0 0 308,274.3506 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M637.6904,274.3506 L637.6904,284.3506 L647.6904,284.3506 L637.6904,274.3506 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="250.0215" x="348.3345" y="292.4204">Two facts carry the rest of the design.</text><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="219.6353" x="351.5464" y="308.2197">Single writer per client socket</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="23.9624" x="571.1816" y="308.2197">, so</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="270.5181" x="338.0862" y="324.019">per-client ordering holds by construction.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="146.2183" x="346.2302" y="339.8184">The wire type is in the</text><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.186" x="497.0188" y="339.8184">framing</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="46.2554" x="554.2048" y="339.8184">, never</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="255.8232" x="345.4336" y="355.6177">in the protobuf, so routing is two bytes</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="89.1782" x="428.7561" y="371.417">and a lookup.</text><line style="stroke:#000000;stroke-width:1.0;" x1="309" x2="646.6904" y1="374.1465" y2="374.1465"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="285.2764" x="330.707" y="391.2163">So the gateway parses no payload, links no</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="284.959" x="330.8657" y="407.0156">service's stubs, and never recompiles when</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="122.2813" x="412.2046" y="422.8149">a service is added.</text><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="219.5464" x="314" y="438.6143">A new service is a TOML block</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="99.144" x="533.5464" y="438.6143">, not a release.</text></g><g id="elem_GMN17"><path d="M577.5,521.3506 L577.5,594.5479 A0,0 0 0 0 577.5,594.5479 L910.938,594.5479 A0,0 0 0 0 910.938,594.5479 L910.938,531.3506 L900.938,521.3506 L748,521.3506 L744,389.4469 L740,521.3506 L577.5,521.3506 A0,0 0 0 0 577.5,521.3506 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M900.938,521.3506 L900.938,531.3506 L910.938,531.3506 L900.938,521.3506 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="297.7051" x="590.8665" y="539.4204">`voice`, `files` and `operator-api` are three</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="312.438" x="583.5" y="555.2197">of the 21. They are drawn outside only because</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="140.8735" x="588.9431" y="571.019">a client reaches them</text><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="151.3789" x="734.387" y="571.019">without the gateway</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.729" x="885.7659" y="571.019">,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="236.4692" x="621.4844" y="586.8184">which is what this diagram is about.</text></g><polygon fill="#8B949E" points="207.6801,326.7524,217.3471,324.8686,211.7764,323.8852,212.7597,318.3145,207.6801,326.7524" style="stroke:#8B949E;stroke-width:1.0;"/><path d="M679.6319,180.5137 C591.1664,192.5957 428.2727,220.4524 299,274.3506 C266.6231,287.8496 238.2508,305.355 212.5957,323.3118 " fill="none" style="stroke:#8B949E;stroke-width:1.0;"/><text fill="#E6EDF3" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="51.5874" x="395" y="252.4204">control</text><text fill="#E6EDF3" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="158.2534" x="451.1577" y="252.4204">&#183; Mumble over TCP+TLS</text><polygon fill="#8B949E" points="162,522.2305,166,513.2305,162,517.2305,158,513.2305,162,522.2305" style="stroke:#8B949E;stroke-width:1.0;"/><path d="M162,397.9445 C162,433.0565 162,481.1091 162,516.2305 " fill="none" style="stroke:#8B949E;stroke-width:1.0;"/><text fill="#E6EDF3" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="132.0122" x="212.8992" y="483.4204">gRPC, routed by the</text><text fill="#E6EDF3" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="229.8105" x="164" y="499.2197">16-bit type in the frame header</text><polygon fill="#8B949E" points="744,335.2936,748,326.2936,744,330.2936,740,326.2936,744,335.2936" style="stroke:#8B949E;stroke-width:1.0;"/><path d="M744,219.4461 C744,255.9691 744,299.4483 744,329.2936 " fill="none" style="stroke:#8B949E;stroke-width:1.0;"/><text fill="#E6EDF3" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="60.9756" x="746" y="252.4204">realtime</text><text fill="#E6EDF3" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="90.873" x="811.5459" y="252.4204">&#183; UDP, no hop</text><polygon fill="#8B949E" points="935.3588,335.2431,939.3588,326.2431,935.3588,330.2431,931.3588,326.2431,935.3588,335.2431" style="stroke:#8B949E;stroke-width:1.0;"/><path d="M808.2693,182.9694 C842.6887,191.6878 883.026,207.7836 908,237.3506 C931.2063,264.8248 935.3793,301.7848 935.3625,329.2431 " fill="none" style="stroke:#8B949E;stroke-width:1.0;"/><text fill="#E6EDF3" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="31.5161" x="922" y="252.4204">bulk</text><text fill="#E6EDF3" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="51.8159" x="958.0864" y="252.4204">&#183; HTTPS</text><polygon fill="#8B949E" points="1116,326.7528,1120,317.7528,1116,321.7528,1112,317.7528,1116,326.7528" style="stroke:#8B949E;stroke-width:1.0;"/><path d="M1116,210.9964 C1116,244.8836 1116,287.9848 1116,320.7528 " fill="none" style="stroke:#8B949E;stroke-width:1.0;"/><text fill="#E6EDF3" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.2334" x="1118" y="252.4204">admin</text><text fill="#E6EDF3" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="118.936" x="1167.8037" y="252.4204">&#183; HTTPS, loopback</text><!--SRC=[XP91ReCm44Ntd6AYBhA9K56hDb5NIPESe1UOu04iZCSQcz3SlWD15UsYbLXOupVlVm6h85Xt20vlt2U87INqcAtXYDA2a3SaENmq11SsDx0HOeE1SjjtRZEUXGmCDZNpFEZy3TYx6oHTAj5VCQeElPa6YJwJ7Z11vHXJL1Hi0jK0Nqd46aCU6XAwfvOe9a9B5CPrA-1itIGLLjQvE6dDs7JqQXzMIZlgCuP5x0Y2BLC_wZtWdGrOKvwjLQ89KR6nG9L8OALR7MrWQ6pPmC2zCy0way4g9mgFvQdRJC4NgbZ5Eb2LzQNhpVUkaX4yUysjffKykyiXEBG-os9hVK313YvOjhLmxyqxEnPuU3mMHV6w899DZixiqmoSNax7yzC2Q0ZrEos8NR7Rxei5iHVXORxS7dRFkzFlox_yM2QMVu43YxRu6PAjvXUp-6- -0000]--></g></svg>