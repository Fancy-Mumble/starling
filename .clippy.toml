excessive-nesting-threshold = 5

# unwrap()/expect()/panic!() are denied in production code (see the
# [workspace.lints.clippy] table in Cargo.toml) but are idiomatic in tests,
# where a failed assertion SHOULD panic with a clear message.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Domain/product names that read fine unbackticked in prose. `..` keeps
# clippy's built-in defaults (OpenGL, WebGL, ...).
doc-valid-idents = [
    "FancyMumble", "SuperUser", "ServerSync", "ServerConfig", "SuggestConfig",
    "CryptSetup", "CodecVersion", "ChannelState", "UserState", "UserRemove",
    "TextMessage", "UDPTunnel", "VoiceTarget", "PermissionDenied",
    "PluginRegistry", "PluginDataTransmission", "RejectType",
    "OCB2", "ZeroC", "SQLite", "PostgreSQL", "MySQL", "MariaDB", "WebRTC", "TOTP",
    "..",
]
