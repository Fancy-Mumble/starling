# cargo-deny policy for the Starling workspace: RUSTSEC advisories, a licence
# allow-list, banned/duplicate crates and registry sources. Run locally with:
#
#     cargo deny check advisories bans licenses sources
#
# This is a network server terminating TLS for untrusted peers, so the ignore
# list is kept empty. Add an entry only with a justification and no upgrade
# path -- never to silence a fixable vulnerability.

[graph]
all-features = true

# ---------------------------------------------------------------------------
# Security advisories (RUSTSEC)
# ---------------------------------------------------------------------------
[advisories]
yanked = "deny"
ignore = [
    # rustls-pemfile is used only at startup to read a cert/key from disk, never
    # on peer input. Clears by migrating to the rustls-pki-types PEM API.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile (unmaintained): startup-only cert/key parsing, no peer input" },
]

# ---------------------------------------------------------------------------
# Licences
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

# aws-lc-sys carries the historic OpenSSL licence. It can enter as rustls'
# default provider; Starling selects `ring` explicitly, so this is a guard.
exceptions = [
    { name = "aws-lc-sys", allow = ["OpenSSL"] },
]

# ---------------------------------------------------------------------------
# Banned / duplicate crates
# ---------------------------------------------------------------------------
[bans]
# Duplicate versions are worth seeing but are not a hard gate.
multiple-versions = "warn"
# Wildcard requirements from crates.io are a real hazard; the workspace's own
# path dependencies legitimately use `*`.
wildcards = "deny"
allow-wildcard-paths = true

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies: adding one needs a deliberate decision, so leave this
# empty and let cargo-deny fail.
allow-git = []
